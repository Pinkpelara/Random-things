<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Wishlist HQ</title>
<meta name="theme-color" content="#0f3d2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wishlist HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --text:#000; --muted:#8a8a8e; --hair:rgba(0,0,0,.12);
  --me1:#1f8fff; --me2:#0a7aff; --them:#e9e9eb; --them-text:#000;
  --bar:rgba(246,246,248,.86); --sheet:#f2f2f7; --card:#fff; --field:#fff; --field-line:#c9c9ce;
  --snow:rgba(140,165,200,.32); --page:#7a1424; --page2:#0f3d2e;
  --green:#34c759; --red:#ff3b30; --amber:#ff9f0a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --text:#fff; --muted:#8d8d93; --hair:rgba(255,255,255,.14);
    --them:#26252a; --them-text:#fff; --bar:rgba(22,22,24,.86); --sheet:#1c1c1e; --card:#2c2c2e;
    --field:#1c1c1e; --field-line:#3a3a3c; --snow:rgba(255,255,255,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#000; --text:#fff; --muted:#8d8d93; --hair:rgba(255,255,255,.14);
  --them:#26252a; --them-text:#fff; --bar:rgba(22,22,24,.86); --sheet:#1c1c1e; --card:#2c2c2e;
  --field:#1c1c1e; --field-line:#3a3a3c; --snow:rgba(255,255,255,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 20% 0%, var(--page2), transparent 60%),
             radial-gradient(1000px 800px at 100% 100%, var(--page), transparent 55%), #1a0b10;
  color:var(--text); overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* ---------- phone shell ---------- */
.phone{
  position:relative; margin:0 auto; height:100dvh; max-width:440px; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; overflow:clip;
}
@media (min-width:700px) and (min-height:760px){
  body{display:grid;place-items:center}
  .phone{height:min(880px,94vh);width:410px;border-radius:52px;
    box-shadow:0 0 0 11px #111,0 0 0 13px #3a3a3c,0 40px 90px rgba(0,0,0,.6)}
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:118px;height:34px;border-radius:20px;background:#000;z-index:60}
  .phone header{padding-top:52px}
}

/* ---------- header ---------- */
header{
  position:relative; z-index:20; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:var(--bar); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--hair); display:grid; grid-template-columns:72px 1fr 72px; align-items:start;
}
.back{display:flex;align-items:center;gap:2px;color:var(--me2);font-size:17px;padding-top:12px}
.back svg{width:13px;height:21px}
.badge{background:var(--me2);color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:1px 7px;margin-left:2px}
.group{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.stack{display:flex;align-items:flex-end;height:46px}
.stack .av{width:38px;height:38px;border:2px solid var(--bg);margin-left:-12px}
.stack .av:first-child{margin-left:0}
.stack .av.mid{width:44px;height:44px;z-index:2}
.gname{font-size:12px;font-weight:500;display:flex;align-items:center;gap:2px;max-width:100%;white-space:nowrap}
.gname b{font-weight:600}
.gname i{color:var(--muted);font-style:normal;font-size:11px}
.hright{display:flex;justify-content:flex-end;gap:14px;padding-top:12px;color:var(--me2)}
.hright svg{width:24px;height:24px}

/* ---------- avatars ---------- */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;position:relative;background:#cfd4dc}
.av.bot{font-size:20px}
.av.santa{background:linear-gradient(#ff8a80,#d32f2f)}
.av.elfie{background:linear-gradient(#a5e7a7,#2e8b57)}
.av.rudolph{background:linear-gradient(#d7b899,#8d5b3b)}
.av.wallet{background:linear-gradient(#ffe08a,#f2a900)}
.av.kid{background:linear-gradient(#b9d4f5,#5d8fd1)}
.av.kid.elsa{background:linear-gradient(#f7c6d3,#d97a96)}
.av img,.av svg{width:122%;height:122%;object-fit:cover;object-position:50% 30%;margin-top:6%}

/* ---------- chat ---------- */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;scroll-behavior:smooth;position:relative;z-index:1;overscroll-behavior:contain}
.stamp-time{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 8px;line-height:1.35}
.stamp-time b{font-weight:600}
.sys{text-align:center;color:var(--muted);font-size:11.5px;margin:8px 24px;line-height:1.35}
.row{display:flex;align-items:flex-end;gap:6px;margin-top:2px;position:relative}
.row.gap{margin-top:9px}
.row.me{justify-content:flex-end}
.row .av{width:28px;height:28px;font-size:15px}
.row .spacer{width:28px;flex:none}
.col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.row.me .col{align-items:flex-end}
.who{font-size:11px;color:var(--muted);margin:0 0 2px 12px}
.bubble{
  position:relative;padding:7px 12px 8px;border-radius:19px;font-size:16px;line-height:1.3;
  background:var(--them);color:var(--them-text);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.row.me .bubble{background:linear-gradient(var(--me1),var(--me2));background-attachment:fixed;color:#fff}
.row.tail .bubble::before,.row.tail .bubble::after{content:"";position:absolute;bottom:0;height:17px}
.row.them.tail .bubble::before{left:-7px;width:20px;background:var(--them);border-bottom-right-radius:16px 14px}
.row.them.tail .bubble::after{left:-10px;width:10px;background:var(--bg);border-bottom-right-radius:10px}
.row.me.tail .bubble::before{right:-7px;width:20px;background:var(--me2);border-bottom-left-radius:16px 14px}
.row.me.tail .bubble::after{right:-10px;width:10px;background:var(--bg);border-bottom-left-radius:10px}
.bubble.emoji{background:none!important;font-size:40px;padding:0 2px}
.bubble.emoji::before,.bubble.emoji::after{display:none}
.linkcard{display:block;text-decoration:none;border-radius:16px;overflow:hidden;background:var(--them);color:var(--them-text);width:240px;max-width:100%;margin-top:3px}
.linkcard .lc-top{height:82px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#c62828,#1b5e20)}
.linkcard .lc-top img{width:44px;height:44px;border-radius:10px;background:#fff;padding:4px}
.linkcard .lc-b{padding:8px 12px 10px}
.linkcard .lc-t{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.linkcard .lc-d{font-size:12px;color:var(--muted);margin-top:2px}
.receipt{font-size:11px;color:var(--muted);text-align:right;margin:3px 4px 0;font-weight:500}
.tb{position:absolute;top:-14px;display:flex;gap:1px;background:var(--them);border:2px solid var(--bg);border-radius:14px;padding:2px 5px;font-size:13px;z-index:3;line-height:1.2}
.row.them .tb{right:-14px}
.row.me .tb{left:-14px;background:var(--me2)}
.pop{animation:pop .36s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(16px);opacity:0}to{transform:none;opacity:1}}
.typing .bubble{display:flex;gap:4px;padding:12px 14px}
.typing .bubble span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing .bubble span:nth-child(2){animation-delay:.2s}.typing .bubble span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- the caricature card ---------- */
.stage{
  position:relative;width:min(300px,100%);border-radius:20px;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 50% 30%,#2e7d4f 0%,#14462f 55%,#0b2a1d 100%);
  padding:12px 8px 0;-webkit-user-select:none;user-select:none
}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 80px 70px,#fff,transparent),
  radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 90px,#fff,transparent),
  radial-gradient(2px 2px at 270px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 130px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 40px 160px,#fff,transparent),radial-gradient(2px 2px at 200px 170px,#fff,transparent);
  animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.4}}
.garland{position:absolute;left:0;right:0;top:0;height:16px;display:flex;justify-content:space-around}
.garland i{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:4px;animation:bulb 1.6s infinite}
.garland i:nth-child(4n+1){background:#ff5252}.garland i:nth-child(4n+2){background:#ffd740;animation-delay:.4s}
.garland i:nth-child(4n+3){background:#69f0ae;animation-delay:.8s}.garland i:nth-child(4n){background:#40c4ff;animation-delay:1.2s}
@keyframes bulb{50%{opacity:.35}}
.stage h2{font-family:"Mountains of Christmas",cursive;font-size:30px;margin:12px 0 0;text-align:center;line-height:1;text-shadow:0 2px 0 #b71c1c,0 4px 10px rgba(0,0,0,.4);position:relative}
.countdown{text-align:center;font-size:11.5px;opacity:.9;margin-top:4px;position:relative;font-variant-numeric:tabular-nums}
.figs{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:30px;position:relative}
.fig{position:relative;width:128px;display:flex;flex-direction:column;align-items:center}
.fig.small{transform:scale(.9);transform-origin:bottom center}
.headwrap{position:relative;width:118px;margin-bottom:-28px;z-index:2;cursor:pointer;transform-origin:50% 92%;animation:bobble 2.6s ease-in-out infinite}
.fig:nth-child(2) .headwrap{animation-delay:-1.1s;animation-duration:2.2s}
@keyframes bobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.headwrap.boing{animation:boing .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{transform:scale(1)}20%{transform:scale(1.25,.8) rotate(-10deg)}45%{transform:scale(.9,1.15) rotate(12deg)}70%{transform:scale(1.06) rotate(-5deg)}100%{transform:scale(1)}}
.head{display:block;width:100%;
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.head svg,.head img{display:block;width:100%;height:auto}
.hat{position:absolute;width:92px;top:-36px;left:-10px;transform:rotate(-18deg);z-index:3;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.fig.r .hat{left:auto;right:-10px;transform:scaleX(-1) rotate(-18deg)}
.body{width:112px;display:block;position:relative;z-index:1}
.nametag{position:relative;margin-top:3px;background:#fff;color:#b71c1c;font-weight:800;font-size:11px;padding:2px 8px;border-radius:8px;z-index:4;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.say{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.6);opacity:0;z-index:9;
  background:#fff;color:#111;font-size:12.5px;font-weight:600;line-height:1.25;padding:7px 10px;border-radius:14px;width:150px;text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.35);transition:.25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.say.on{opacity:1;transform:translateX(-50%) scale(1)}
.snowbank{height:34px;background:linear-gradient(#fff,#e3eef8);border-radius:50% 50% 0 0/100% 100% 0 0;margin:-26px -12px 0;position:relative;z-index:0}
.figs .fig{z-index:1}
.stage-cap{background:var(--them);color:var(--them-text);font-size:12px;padding:6px 12px 8px;text-align:center}

/* ---------- composer ---------- */
.composer{position:relative;z-index:20;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.me-btn{position:relative;width:38px;height:38px;flex:none;perspective:200px}
.me-btn .av{width:38px;height:38px;transition:transform .45s}
.me-btn.flip .av{transform:rotateY(360deg)}
.me-btn::after{content:"⇄";position:absolute;right:-4px;bottom:-3px;background:var(--me2);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg)}
.plus{width:34px;height:34px;border-radius:50%;background:var(--them);display:grid;place-items:center;flex:none;margin-bottom:2px;font-size:22px;color:var(--muted);transition:transform .25s}
.plus.open{transform:rotate(45deg)}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;border:1px solid var(--field-line);border-radius:20px;background:var(--field);padding:3px 3px 3px 12px;min-height:38px}
.field textarea{flex:1;min-width:0;width:100%;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.3;padding:6px 0;max-height:120px}
.field textarea::placeholder{color:var(--muted)}
.sendb{width:30px;height:30px;border-radius:50%;background:var(--me2);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .15s}
.sendb:disabled{opacity:.35}
.sendb svg{width:16px;height:16px}
@media (max-width:360px){.composer{gap:6px;padding-left:8px;padding-right:8px}.me-btn,.me-btn .av{width:34px;height:34px}.plus{width:30px;height:30px}.menu{left:44px}}
.hint{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:11px;color:var(--muted);pointer-events:none}
.menu{position:absolute;bottom:calc(100% + 6px);left:52px;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);overflow:hidden;transform-origin:bottom left;transform:scale(.8);opacity:0;pointer-events:none;transition:.2s;z-index:30;min-width:210px}
.menu.on{transform:none;opacity:1;pointer-events:auto}
.menu button{display:flex;gap:10px;align-items:center;width:100%;padding:12px 14px;font-size:15px;text-align:left;border-bottom:.5px solid var(--hair)}
.menu button:last-child{border:0}
.menu button:active{background:var(--hair)}

/* ---------- reactions ---------- */
.react{position:fixed;z-index:80;display:flex;gap:2px;background:var(--card);border-radius:24px;padding:5px 7px;box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .25s}
.react button{font-size:24px;width:38px;height:38px;border-radius:50%;transition:transform .12s}
.react button:hover,.react button.sel{background:var(--hair);transform:scale(1.15)}
.dim{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.15)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;z-index:41;background:var(--sheet);border-radius:14px 14px 0 0;
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--muted);opacity:.5;margin:7px auto 4px}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 8px}
.sh-head h3{margin:0;font-size:17px}
.sh-head button{color:var(--me2);font-size:16px;font-weight:600}
.sh-body{overflow-y:auto;padding:0 14px calc(env(safe-area-inset-bottom) + 16px)}
.seg{display:flex;background:var(--hair);border-radius:9px;padding:2px;margin:0 0 12px}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:13px;font-weight:600}
.seg button.on{background:var(--card);box-shadow:0 2px 6px rgba(0,0,0,.12)}
.kidhead{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px}
.kidhead .av{width:56px;height:56px}
.kidhead h4{margin:0;font-size:18px}
.meter{height:8px;border-radius:5px;background:var(--hair);overflow:hidden;margin:6px 0 3px}
.meter i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#3a3a3c,#ff3b30 20%,#ff9f0a 45%,#34c759 75%,#5ac8fa);background-size:240px 100%;transition:width .5s}
.small{font-size:12px;color:var(--muted)}
.items{background:var(--card);border-radius:14px;overflow:hidden}
.item{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:10px 10px 10px 12px;border-bottom:.5px solid var(--hair)}
.item:last-child{border:0}
.vstamp{font-size:10px;font-weight:800;letter-spacing:.02em;padding:4px 6px;border-radius:6px;border:1.5px solid;transform:rotate(-6deg);white-space:nowrap;line-height:1.1;text-align:center}
.vstamp small{display:block;font-size:8px;font-weight:600;opacity:.75}
.v-yes{color:#1f9d4c;border-color:#1f9d4c}
.v-maybe{color:#e08600;border-color:#e08600}
.v-no{color:#e5241b;border-color:#e5241b}
.it-t{font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.it-d{font-size:12px;color:var(--me2);text-decoration:none}
.stars{font-size:12px;letter-spacing:-2px;white-space:nowrap;padding:4px}
.del{width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:14px}
.empty{text-align:center;padding:26px 10px;color:var(--muted);font-size:14px}
.bigbtn{display:block;width:100%;margin-top:14px;padding:13px;border-radius:12px;background:var(--me2);color:#fff;font-weight:600;font-size:16px}
.bigbtn.ghost{background:var(--card);color:var(--red)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:stretch}
.vs .side{background:var(--card);border-radius:14px;padding:12px;text-align:center}
.vs .side .av{width:64px;height:64px;margin:0 auto 6px}
.vs .mid{display:grid;place-items:center;font-family:"Mountains of Christmas",cursive;font-size:28px;color:var(--red)}
.stat{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;border-top:.5px solid var(--hair)}
.stat b{font-variant-numeric:tabular-nums}
.verdict-box{background:var(--card);border-radius:14px;padding:14px;margin-top:10px;text-align:center;font-size:15px;line-height:1.4}
.members{background:var(--card);border-radius:14px;overflow:hidden;margin-bottom:12px}
.member{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:.5px solid var(--hair)}
.member:last-child{border:0}
.member .av{width:38px;height:38px;font-size:19px}
.member div{flex:1}
.member b{display:block;font-size:15px;font-weight:600}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px;border-bottom:.5px solid var(--hair);font-size:15px;gap:10px}
.toggle:last-child{border:0}
.sw{width:51px;height:31px;border-radius:16px;background:var(--hair);position:relative;transition:.2s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s}
.sw.on{background:var(--green)}.sw.on::after{left:22px}
.bigav{display:flex;flex-direction:column;align-items:center;gap:6px;padding:4px 0 14px}
.bigav .stack .av{width:64px;height:64px;margin-left:-18px}
.bigav .stack .av:first-child{margin-left:0}
.bigav .stack{height:auto}
.bigav h2{margin:0;font-size:22px}

/* ---------- banner ---------- */
.banner{position:absolute;top:calc(env(safe-area-inset-top) + 8px);left:8px;right:8px;z-index:70;display:flex;gap:10px;align-items:center;
  background:var(--bar);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:18px;padding:10px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-140%);opacity:0;visibility:hidden;transition:transform .4s cubic-bezier(.2,1.2,.4,1),opacity .3s,visibility .4s}
@media (min-width:700px) and (min-height:760px){.banner{top:52px}}
.banner.on{transform:none;opacity:1;visibility:visible}
.banner .av{width:36px;height:36px;font-size:19px}
.banner div{font-size:13.5px;line-height:1.3;min-width:0}
.banner b{display:block;font-size:13px}

canvas#snow{position:absolute;inset:0;z-index:15;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .headwrap{animation:none}.garland i{animation:none}.stage::before{animation:none}
}
</style>
</head>
<body>
<div class="phone" id="phone">
  <canvas id="snow"></canvas>

  <header>
    <button class="back" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 13 21"><path d="M11 2 3 10.5 11 19" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="badge">25</span>
    </button>
    <button class="group" id="groupBtn" aria-label="Group details">
      <div class="stack" id="hdrStack"></div>
      <div class="gname"><b>🎄 Wishlist HQ</b><i>›</i></div>
    </button>
    <div class="hright">
      <button id="listBtn" aria-label="Open wishlists" title="Wishlists">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>
      </button>
      <button id="ftBtn" aria-label="FaceTime">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="1.5" y="6" width="14" height="12" rx="3"/><path d="M17 10.2 22 7v10l-5-3.2z"/></svg>
      </button>
    </div>
  </header>

  <main class="chat" id="chat" aria-live="polite"></main>

  <div class="composer" id="composer">
    <div class="hint" id="hint"></div>
    <button class="me-btn" id="meBtn" aria-label="Switch who is typing"></button>
    <button class="plus" id="plusBtn" aria-label="More">+</button>
    <div class="menu" id="menu">
      <button data-act="paste">🔗 <span>Paste a link</span></button>
      <button data-act="idea">🎲 <span>Elfie, give me an idea</span></button>
      <button data-act="lists">📋 <span>See the wishlists</span></button>
      <button data-act="share">📤 <span>Send lists to the parents</span></button>
    </div>
    <div class="field">
      <textarea id="ta" rows="1" placeholder="iMessage" enterkeyhint="send" aria-label="Type a wish or paste a link"></textarea>
      <button class="sendb" id="sendBtn" aria-label="Send" disabled>
        <svg viewBox="0 0 16 16"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <div class="sh-head"><h3 id="shTitle"></h3><button id="shDone">Done</button></div>
    <div class="sh-body" id="shBody"></div>
  </section>

  <div class="banner" id="banner"></div>
</div>

<script>
/* Face photos for the caricatures. null = drawn cartoon faces. */
const PHOTOS = null;

/* ============================================================
   Cast
   ============================================================ */
const KIDS = ['artin','elsa'];
const NAME = {artin:'Artin', elsa:'Elsa', santa:'Santa', elfie:'Elfie the Elf', rudolph:'Rudolph', wallet:"Parents' Wallet"};
const SHORT = {artin:'Artin', elsa:'Elsa', santa:'Santa', elfie:'Elfie', rudolph:'Rudolph', wallet:'Wallet'};
const EMO = {santa:'🎅', elfie:'🧝', rudolph:'🦌', wallet:'💳'};
const ROLE = {santa:'Head of Gift Approvals', elfie:'Chief Judging Officer 💅', rudolph:'Logistics & Sarcasm', wallet:'Is scared'};
const other = k => k === 'artin' ? 'elsa' : 'artin';
const rnd = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================================================
   State (saved on this device only)
   ============================================================ */
const LS = 'wishlistHQ.v1';
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(LS, JSON.stringify(v)); } catch(e){} }
};
const fresh = () => ({v:1, seq:0, msgs:[], items:[], nice:{artin:50, elsa:50}, sender:'artin', snow:true, swap:false, pokes:{artin:0, elsa:0}});
let S = Object.assign(fresh(), store.get() || {});
const save = () => { if (S.msgs.length > 260) S.msgs = S.msgs.slice(-260); store.set(S); };

/* ============================================================
   Drawings: faces, bodies, hat
   ============================================================ */
const look = k => S.swap ? other(k) : k;   // whose face/outfit belongs to this name

function cartoonFace(k){
  if (k === 'artin') return `<svg viewBox="0 0 100 120" aria-hidden="true">
    <g fill="#2a1b14">${[[22,40,14],[34,26,15],[50,20,16],[66,25,15],[78,38,14],[84,54,10],[16,56,10],[28,34,12],[72,32,12]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
    <ellipse cx="14" cy="70" rx="6" ry="9" fill="#d29a74"/><ellipse cx="86" cy="70" rx="6" ry="9" fill="#d29a74"/>
    <ellipse cx="50" cy="70" rx="33" ry="40" fill="#e1aa84"/>
    <g fill="#2a1b14">${[[30,40,9],[42,34,10],[56,33,10],[69,40,9],[50,38,8]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
    <path d="M33 60q6-4 12 0M55 60q6-4 12 0" stroke="#3a2418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="39" cy="68" r="3.6" fill="#2a1b14"/><circle cx="61" cy="68" r="3.6" fill="#2a1b14"/>
    <path d="M49 72q-3 9 1 11" stroke="#b97d5c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M38 90q12 9 24 0" stroke="#7a3b2b" stroke-width="3" fill="#fff" stroke-linecap="round"/>
    <circle cx="30" cy="82" r="5" fill="#f08a7a" opacity=".35"/><circle cx="70" cy="82" r="5" fill="#f08a7a" opacity=".35"/></svg>`;
  return `<svg viewBox="0 0 100 120" aria-hidden="true">
    <path d="M12 60q0-48 38-48t38 48v42q0 12-14 12H26q-14 0-14-12z" fill="#21160f"/>
    <ellipse cx="50" cy="70" rx="31" ry="38" fill="#e3ad8a"/>
    <path d="M18 58q4-36 32-38 28 2 32 38-14-20-32-22-18 2-32 22z" fill="#21160f"/>
    <path d="M50 20v22" stroke="#3a2a20" stroke-width="1.5"/>
    <path d="M35 60q6-3 11 0M54 60q6-3 11 0" stroke="#2f1f16" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="68" r="3.6" fill="#21160f"/><circle cx="60" cy="68" r="3.6" fill="#21160f"/>
    <path d="M49 72q-2 8 1 10" stroke="#bf8566" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M41 89q9 5 18 0" stroke="#8a3f3f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="31" cy="82" r="5" fill="#f08a9a" opacity=".4"/><circle cx="69" cy="82" r="5" fill="#f08a9a" opacity=".4"/></svg>`;
}
const faceHTML = k => { const f = look(k); return PHOTOS && PHOTOS[f] ? `<img src="${PHOTOS[f]}" alt="">` : cartoonFace(f); };

function bodySVG(k){
  const f = look(k), navy = '#1b2342', skin = '#d9a27c';
  const crest = `<g transform="translate(60 46)" fill="#fff" font-family="-apple-system,system-ui,sans-serif" font-weight="800" text-anchor="middle">
      <circle r="17" fill="none" stroke="#fff" stroke-width="1.6"/><circle r="13" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="2 1.6"/>
      <text y="-4" font-size="5.6">NORTH</text><text y="2.5" font-size="5.6">POLE U</text><text y="9" font-size="4">EST. 0 AD</text></g>`;
  const strings = `<path d="M51 7l-2 22M69 7l2 22" stroke="#4a5687" stroke-width="2" stroke-linecap="round"/>`;
  if (f === 'artin') return `<svg class="body" viewBox="0 0 120 136" aria-hidden="true">
    <path d="M27 90h66l3 21H63l-3-9-3 9H24z" fill="#7fb3e6"/>
    <rect x="32" y="109" width="12" height="14" fill="${skin}"/><rect x="76" y="109" width="12" height="14" fill="${skin}"/>
    <rect x="32" y="119" width="12" height="6" fill="#fff"/><rect x="76" y="119" width="12" height="6" fill="#fff"/>
    <g fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.2"><path d="M26 126q0-6 12-6t14 6v4H26z"/><path d="M68 126q2-6 14-6t12 6v4H68z"/></g>
    <path d="M30 126h18M72 126h18" stroke="#9aa3ad" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M30 8q30-8 60 0 14 4 18 22l6 44q-6 4-13 2l-5-34v50q-36 4-72 0V42l-5 34q-7 2-13-2l6-44q4-18 18-22z" fill="${navy}"/>
    <path d="M40 74q20-4 40 0l4 16H36z" fill="none" stroke="#323d6e" stroke-width="1.6"/>
    ${crest}${strings}
    <circle cx="108" cy="79" r="5.5" fill="${skin}"/><circle cx="12" cy="79" r="5.5" fill="${skin}"/>
    <rect x="102" y="72" width="7" height="12" rx="2" fill="#2b2b33" transform="rotate(-8 105 78)"/></svg>`;
  return `<svg class="body" viewBox="0 0 120 136" aria-hidden="true">
    <rect x="40" y="104" width="11" height="16" fill="${skin}"/><rect x="69" y="104" width="11" height="16" fill="${skin}"/>
    <g fill="#ecbdc9" stroke="#c9919f" stroke-width="1.2"><rect x="35" y="114" width="20" height="17" rx="6"/><rect x="65" y="114" width="20" height="17" rx="6"/></g>
    <path d="M30 8q30-8 60 0 14 4 18 22l7 50q-6 4-14 2l-5-40 4 66q-40 6-80 0l4-66-5 40q-8 2-14-2l7-50q4-18 18-22z" fill="${navy}"/>
    <path d="M38 80q22-4 44 0l4 18H34z" fill="none" stroke="#323d6e" stroke-width="1.6"/>
    ${crest}${strings}
    <path d="M101 80q7 1 13-1M6 79q6 2 13 1" stroke="#323d6e" stroke-width="1.5" fill="none"/></svg>`;
}
const HAT = `<svg class="hat" viewBox="0 0 100 72" aria-hidden="true">
  <path d="M8 54C18 22 44 2 72 6c16 2 25 16 21 34-6-12-15-17-24-16 10 9 17 19 19 30z" fill="#d7262e"/>
  <path d="M30 22c10-10 24-15 40-14" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
  <rect x="2" y="48" width="92" height="17" rx="8.5" fill="#fff"/><circle cx="93" cy="40" r="9" fill="#fff"/></svg>`;

function avHTML(k, cls=''){
  if (EMO[k]) return `<span class="av bot ${k} ${cls}" aria-hidden="true">${EMO[k]}</span>`;
  return `<span class="av kid ${look(k)} ${cls}" aria-hidden="true">${faceHTML(k)}</span>`;
}

/* ============================================================
   Roast library
   {n}=sender, {o}=sibling, {i}=item
   ============================================================ */
const CATS = [
  {k:/\bcoal\b/, t:1, l:[['santa',"You... asked for coal. Saving Santa the paperwork. Efficient. Respect."],['rudolph',"reverse psychology. we see you, {n}."]]},
  {k:/world peace|\bhappiness\b|\bhealth\b|\bfamily\b|\blove\b/, t:1, l:[['santa',"Aww. That's lovely, {n}. Santa will try. Now what do you ACTUALLY want"],['elfie',"pageant answer detected 🏆 now tell us the real wish"]]},
  {k:/^(nothing|idk|i don'?t know|dunno|anything|whatever)\b/, t:1, l:[['elfie',"'{i}'. ok. so when you get nothing on Dec 25 you'll be totally fine with it? 🙂 thought so"],['santa',"'{i}' is not a gift, {n}. Santa needs SPECIFICS."]]},
  {k:/stanley cup|maple leafs|\bleafs\b|raptors|blue jays|\bjays\b|\bjersey\b|hockey|\bskates?\b|\bnhl\b/, t:2, l:[['santa',"A Leafs thing? Santa can deliver merch. A Leafs Stanley Cup is outside Santa's powers. Santa is magic, not a miracle worker. 🍁"],['rudolph',"go leafs go 🍁 (see you in disappointment in april)"]]},
  {k:/iphone|i phone|pixel \d|galaxy s\d|samsung (phone|galaxy)|new phone/, t:4, l:[['elfie',"a new phone. groundbreaking. never been done. truly the most original wish ever written 🙄"],['santa',"Which one, {n}? There are like 40 of them now. Santa still uses a flip phone."],['rudolph',"you literally have a phone in your hand in every photo ever taken of you"]]},
  {k:/apple ?watch|smart ?watch|\bwatch\b/, t:3, l:[['elfie',"so you can check the time... which is on your phone... which you hold 24/7"]]},
  {k:/airpods|headphones|earbuds|\bbeats\b|bose|sony wh|\bjbl\b|speaker/, t:3, l:[['elfie',"noise cancelling so you can ignore {o} in high definition. smart."],['santa',"Santa approves. Santa also knows Santa will now be ignored in high definition. Classic."]]},
  {k:/macbook|laptop|\bipad\b|tablet|chromebook/, t:4, l:[['santa',"'It's for school.' Sure, {n}. Santa has heard 'for school' 3 million times. It's always for YouTube."],['elfie',"for 'homework' 👀 (homework = minecraft at 1am)"]]},
  {k:/\bps5\b|\bps4\b|playstation|xbox|nintendo|\bswitch( 2)?\b|steam deck|gaming pc|\brtx\b|\bgpu\b|\bvr\b|quest 3|meta quest/, t:4, l:[['rudolph',"the elves can't build consoles. we tried in 2020. we made a toaster that runs fortnite. it was bad."],['santa',"Santa will need to see your screen-time report first, {n}. 📊"],['elfie',"goodbye sunlight. it was nice knowing you {n} ☀️👋"]]},
  {k:/controller|gaming chair|gaming headset|keyboard|mouse/, t:2, l:[['elfie',"RGB on everything so you can lose with *lighting*"],['rudolph',"respectfully, the controller isn't why you're losing"]]},
  {k:/robux|v-?bucks|fortnite|roblox|minecraft|valorant|riot points|cod points|skins?\b/, t:2, l:[['elfie',"asking Santa for fake money to buy fake clothes for a fake character. capitalism has reached the north pole"],['rudolph',"the elves have just been informed robux aren't real. they are devastated."]]},
  {k:/gift ?card/, t:2, l:[['elfie',"a gift card is just money wearing a costume. I see you {n}. 🕵️"]]},
  {k:/\bmoney\b|\bcash\b|\$\$|bitcoin|crypto|\bstocks?\b|e-?transfer|interac|\bbucks\b/, t:3, l:[['santa',"Cash?? Santa's gift-wrapping department is personally offended."],['elfie',"money isn't a wish, {n}, that's an invoice 💀"],['rudolph',"bold of you to assume Santa has money. he pays the elves in cookies."]]},
  {k:/\bcar\b|tesla|lambo|lamborghini|ferrari|porsche|mercedes|\bbmw\b|maserati|\bjeep\b/, t:4, l:[['santa',"{n}. You can't drive. Santa checked."],['rudolph',"I am the car. I am literally the car. 🦌"]]},
  {k:/\bdog\b|puppy|\bcat\b|kitten|bunny|hamster|\bpet\b|\bfish\b|parrot|\bhorse\b|\bpony\b|guinea pig|turtle|lizard|snake/, t:3, l:[['santa',"A pet is a commitment, {n}. Who's walking it at 7am in January in Ontario? Be honest with Santa."],['elfie',"{o} is about to promise to 'help'. {o} will not help."],['rudolph',"as an animal I fully support more animals in the house 🦌❤️"]]},
  {k:/jordan|\bnike\b|dunks?\b|adidas|yeezy|new balance|asics|sneaker|\bshoes\b|\bcrocs\b|\bvans\b|converse|on cloud|hoka/, t:3, l:[['elfie',"you have two feet. TWO. how many shoes does one person need 😭"],['rudolph',"hooves don't need sneakers and honestly we're thriving"],['elfie',"your current shoes saw this message. they're hurt."]]},
  {k:/\buggs?\b|\bboots?\b/, t:2, l:[['santa',"Boots. Practical. It's -20 in January. Santa approves. Finally a sane wish."],['elfie',"more boots?? the pink ones are crying in the closet rn"]]},
  {k:/lululemon|aritzia|belt bag|align|wunder|scuba|super puff/, t:3, l:[['elfie',"the uniform. understood. 🫡"],['rudolph',"a belt bag. to carry your phone. which is already permanently in your hand."],['santa',"Santa looked at the price tag and had to sit down. Santa is fine. Santa is FINE."]]},
  {k:/sephora|skincare|skin care|drunk elephant|\brhode\b|glossier|makeup|lip ?(gloss|oil|balm)|sol de janeiro|summer fridays|laneige|charlotte tilbury|bubble|serum|moisturi[sz]er|mascara|nail/, t:3, l:[['elfie',"a 12-step skincare routine?? bestie your skin barrier is literally perfect"],['santa',"Santa doesn't know what a 'lip oil' is but Santa respects it."],['rudolph',"my nose glows naturally. no products. just vibes. ✨🔴"]]},
  {k:/stanley|owala|hydro ?flask|\byeti\b|water bottle|tumbler/, t:2, l:[['elfie',"a $60 water bottle so you can drink... the same water. I checked. it's the same water."],['santa',"Santa approves of hydration. Santa does not approve of the price of hydration."]]},
  {k:/\blego\b/, t:2, l:[['santa',"LEGO! A classic! The elves are cheering. Santa will NOT be stepping on it barefoot though."],['elfie',"ngl the elves are elite at lego. this is our moment 💪"]]},
  {k:/\bbooks?\b|kindle|novel|manga|comic/, t:1, nice:5, l:[['santa',"A BOOK?! {n}, Santa is emotional. +5 nice points 📚🥹"],['elfie',"reading?? in this economy??"]]},
  {k:/\bsocks?\b|pajamas|pyjamas|\bpjs\b|slippers|blanket|heated/, t:1, l:[['santa',"Cozy stuff, voluntarily?? Who raised you? (great job, parents)"],['elfie',"this is the most dad wish i've ever seen and I love it"]]},
  {k:/gucci|louis vuitton|\blv\b|prada|balenciaga|chanel|\bdior\b|versace|designer|rolex|cartier|goyard|moncler|canada goose|\bysl\b|off-?white/, t:4, l:[['elfie',"designer?? who are you trying to impress, the school bus driver? 💀"],['santa',"The workshop doesn't have a luxury department. We have a 'nice socks' department."]]},
  {k:/drone|camera|gopro|polaroid|instax|ring light|tripod|microphone|\bmic\b/, t:3, l:[['santa',"Content creator era loading... Santa demands to be in the first video."],['elfie',"can't wait for the 'day in my life' vlog: woke up. ate cereal. complained about {o}. the end."]]},
  {k:/perfume|cologne|fragrance|body spray|\baxe\b/, t:3, l:[['elfie',"please be the good kind and not the kind you can smell from the next hallway 😷"],['rudolph',"I can smell it from the north pole already"]]},
  {k:/\bbike\b|e-?bike|scooter|skateboard|hoverboard|rollerblades?/, t:3, l:[['santa',"Outdoor activity! Santa approves. Helmet included. Non-negotiable. ⛑️"]]},
  {k:/\bski(s|ing)?\b|snowboard|sled|toboggan/, t:3, l:[['rudolph',"snow sports! finally someone in this family who gets me ❄️🦌"]]},
  {k:/\btrip\b|travel|disney|vacation|japan|paris|\btickets?\b|concert|taylor swift|\beras\b|cruise|hawaii|cancun/, t:4, l:[['santa',"The sleigh is for presents, {n}. It is NOT an Uber."],['rudolph',"I am not flying you anywhere. my back."]]},
  {k:/\bled\b|lights|\bbed\b|\bdesk\b|beanbag|room decor|mini ?fridge|lava lamp/, t:2, l:[['elfie',"so the room can be purple at 3am. iconic. respect."]]},
  {k:/chocolate|candy|snacks?|cookies?|nutella|ferrero|kinder|chips|gummies|sour patch/, t:1, l:[['santa',"Snacks. Simple. Honest. Santa relates on a spiritual level. 🍪"]]},
  {k:/phone case|charger|cable|power ?bank|adapter/, t:1, l:[['rudolph',"a charger. so practical. are you secretly 45 years old"]]},
  {k:/hoodie|sweater|sweatshirt|university|\buoft\b|clothes|shirt|jacket|pants|\bdress\b|\bjeans\b|sweatpants|leggings/, t:2, l:[['elfie',"more hoodies? you two already showed up to the family photo in matching University of Toronto merch like you got early admission 🎓"],['santa',"Clothes! The one gift that gets an 'oh... thanks' face. Santa is ready for it."]]},
  {k:/guitar|piano|drums?\b|ukulele|violin|\bbass\b|karaoke/, t:3, l:[['santa',"An instrument! The neighbours have been notified. They are not happy. 🎸"],['elfie',"{o} is gonna need noise-cancelling headphones for this one"]]},
  {k:/pok[eé]mon|trading cards|\bcards\b|anime|figure|plush|squishmallow|jellycat/, t:2, l:[['elfie',"the collection grows. one day you'll be 40 and it'll all be worth $3. invest wisely"]]},
  {k:/\btv\b|monitor|projector|\boled\b/, t:4, l:[['rudolph',"a screen bigger than my sleigh is not a reasonable wish"]]},
];
const DOMAINS = [
  {d:/amazon\./, l:[['elfie',"an amazon link. so the elves are just Jeff Bezos now. cool cool cool 📦"]]},
  {d:/apple\.com/, l:[['wallet',"apple.com 😰"]]},
  {d:/sephora\./, l:[['elfie',"a sephora link. I can smell the 20 free samples from here"]]},
  {d:/lululemon\./, l:[['elfie',"lululemon. the uniform. understood."]]},
  {d:/aritzia\./, l:[['elfie',"aritzia. the OTHER uniform."]]},
  {d:/nike\.com/, l:[['rudolph',"just do it? more like just pay for it"]]},
  {d:/stockx\.|goat\.com/, l:[['wallet',"resale prices?? *Parents' Wallet has left the chat* ...jk I can't leave, I'm a wallet"]]},
  {d:/temu\.|shein\.|aliexpress\./, l:[['santa',"Arrives in 3 to 6 business MONTHS. Santa respects the budget though."]]},
  {d:/costco\./, l:[['elfie',"a costco link?? are we getting 48 rolls of toilet paper for christmas"]]},
  {d:/bestbuy\./, l:[['rudolph',"best buy. the elves call it 'worst wallet'"]]},
  {d:/walmart\./, l:[['santa',"Walmart. Practical. Santa likes practical."]]},

const URL_RE = /(https?:\/\/[^\s]+|www\.[^\s]+|\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|ca|co|net|org|io|shop|store|co\.uk)(?:\/[^\s]*)?)/i;
function slugTitle(u){
  try{
    const url = new URL(u), segs = url.pathname.split('/').filter(Boolean).map(s => decodeURIComponent(s));
    let s = null; const dp = segs.indexOf('dp');
    if (dp > 0) s = segs[dp-1];
    if (!s) s = segs.filter(x => /[a-z]/i.test(x) && /[-_+]/.test(x)).sort((a,b) => b.length - a.length)[0];
    if (!s && url.searchParams.get('q')) s = url.searchParams.get('q');
    if (!s) return null;
    const words = s.replace(/\.(html?|php|aspx)$/i,'').split(/[-_+\s]+/).filter(w => w && !/^\d+$/.test(w) && !/^[a-z0-9]{9,}$/i.test(w) && !/^[a-z]{0,2}\d{4,}$/i.test(w) || /^[a-z]{9,}$/i.test(w));
    if (!words.length) return null;
    let t = words.join(' ');
    t = t.charAt(0).toUpperCase() + t.slice(1);
    return t.length > 60 ? t.slice(0,58) + '…' : t;
  }catch(e){ return null; }
}
function parseLine(line){
  const m = line.match(URL_RE);
  let url = null, domain = null, title = line;
  if (m){
    url = /^https?:/i.test(m[1]) ? m[1] : 'https://' + m[1];
    url = url.replace(/[).,!]+$/,'');
    try { domain = new URL(url).hostname.replace(/^www\./,''); } catch(e){ url = null; }
    title = line.replace(m[1],'');
  }
  title = title.replace(/^[\s\-*•·]+|^\d+[.)]\s*/,'').replace(/[\s,]*\b(please+|pls+|plz+|thanks?|thank you|santa)\b[\s!.?]*$/i,'').replace(/\s+/g,' ').trim();
  if (!title && url) title = slugTitle(url) || ('something from ' + domain);
  return {title, url, domain};
}
function analyze(p){
  const hay = (p.title + ' ' + (p.url || '')).toLowerCase();
  const cat = CATS.find(c => c.k.test(hay)) || null;
  let tier = cat ? cat.t : 2;
  const price = hay.match(/\$\s?(\d[\d,]*(?:\.\d+)?)|(\d[\d,]*)\s?(?:\$|dollars|bucks)/);
  if (price){ const v = parseFloat((price[1] || price[2]).replace(/,/g,'')); tier = v < 30 ? 1 : v < 150 ? 2 : v < 600 ? 3 : 4; }
  const pool = cat ? cat.l.slice() : [];
  const dom = p.domain && DOMAINS.find(d => d.d.test(p.domain));
  return {tier, pool, dom: dom ? dom.l : [], nice: cat && cat.nice || 0};
}

const CHIT = [
  {k:/(santa|you).{0,12}(fake|not real|doesn'?t exist|isn'?t real)/i, any:1, r:[['santa',"And yet here Santa is. In your group chat. Typing. 🤔"],['rudolph',"says the person talking to a reindeer"]]},
  {k:/^(hi|hey|hello|yo|sup|hii+|heyy+|wassup|what'?s up)\b/i, r:[['santa',"Hi {n}! Wishes please. Santa is on a schedule. 🛷"],['elfie',"heyyy {n} 💅 what are we wishing for"]]},
  {k:/^(thanks|thank you|ty|thx|merci)\b/i, r:[['santa',"You're welcome, {n}. Now behave. 👀"]]},
  {k:/^(lol|lmao|haha+|hehe+|💀|😂|🤣)/i, r:[['elfie',"glad we're having fun. Santa is not laughing. Santa is CALCULATING. 🧮"]]},
  {k:/^(ok|okay|k|kk|fine|bet)\b/i, r:[['rudolph',"ok."]]},
  {k:/(i love you|love u|ily)/i, r:[['santa',"Santa loves you too, {n}. Santa is still judging the list though. ❤️"]]},
  {k:/(you('?re| are)? (so )?(stupid|dumb|annoying)|shut up|i hate (you|this|santa|elfie|rudolph))/i, any:1, r:[['santa',"Language, {n}. That's -3 nice points. Santa is always watching. 👁️"]], nice:-3},
  {k:/(naughty|nice) list|am i (on the )?(naughty|nice)|my score/i, any:1, r:[['santa',"You're at {score}/100, {n}. Status: {label}."]]},
  {k:/who('?s| is) (the |santa'?s )?fav/i, any:1, r:[['santa',"Santa doesn't have favourites. (it's whoever has the higher nice score. currently: {fav})"]]},
];
function niceLabel(v){ return v <= 20 ? 'coal-adjacent 🪨' : v <= 40 ? 'on thin ice 🧊' : v <= 60 ? 'mid. very mid. 😐' : v <= 80 ? 'pretty nice 😇' : 'suspiciously angelic 👼'; }
function bump(who, d){ S.nice[who] = Math.max(0, Math.min(100, (S.nice[who] || 50) + d)); }
function fav(){ const a = S.nice.artin, e = S.nice.elsa; return a === e ? "it's a tie. Santa refuses to pick. Santa has been burned before." : NAME[a > e ? 'artin' : 'elsa']; }

function think(who, text){
  const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const hasUrl = URL_RE.test(text);

  // chit-chat, questions and other not-a-wish messages
  if (!hasUrl && lines.length === 1){
    for (const c of CHIT){
      if (c.k.test(text) && (c.any || text.split(/\s+/).length <= 5)){
        if (c.nice) bump(who, c.nice);
        save();
        const [f, s] = rnd(c.r);
        bot(f, fill(s, who).replace('{score}', S.nice[who]).replace('{label}', niceLabel(S.nice[who])).replace('{fav}', fav()));
        return;
      }
    }
    if (/\?\s*$/.test(text) && !/^(can i|could i|i want|i'?d like|may i)/i.test(text)){
      bot(rnd(['santa','rudolph']), rnd(["great question. no idea. I'm a deer. 🦌","Santa's legal team advises Santa not to answer that.","ask your parents. no wait, don't. they'll ask what you want for christmas and we'll be back here."]));
      return;
    }
    if (isEmojiOnly(text)){ bot('elfie', rnd(["very descriptive. the elves will build... a '"+text+"'. sure.", "emojis are not a wish, {n}. use your words 😤".replace('{n}', NAME[who])])); return; }
  }

  // it's a wish (or several)
  const added = [];
  for (const line of lines){
    const p = parseLine(line.replace(/^(i want|i'?d like|can i (get|have)|i wish for|i need|please get me|dear santa,?)\s+/i,''));
    if (!p.title || p.title.length < 2) continue;
    const a = analyze(p);
    const item = {id: 'i' + (++S.seq), who, title: p.title, url: p.url, domain: p.domain, tier: a.tier, verdict: rollVerdict(a.tier), prio: 2, ts: Date.now()};
    S.items.push(item);
    bump(who, a.tier === 1 ? 1 : -(a.tier - 1) * 2);
    if (a.nice) bump(who, a.nice);
    added.push({item, a});
  }
  if (!added.length){ bot('santa', "Santa couldn't find a wish in that. Try again, slower. Santa is old."); return; }

  const mine = S.items.filter(x => x.who === who).length;
  const theirs = S.items.filter(x => x.who === other(who)).length;
  if (added.length === 1){
    const v = V[added[0].item.verdict];
    addMsg({from:'sys', text:`📋 Added to ${NAME[who]}'s list · Santa's verdict: ${v[0]} ${v[1]}`});
  } else {
    addMsg({from:'sys', text:`📋 ${added.length} wishes added to ${NAME[who]}'s list`});
  }

  // roast the most extravagant one
  const worst = added.slice().sort((x,y) => y.a.tier - x.a.tier)[0];
  const short = worst.item.title.length > 34 ? worst.item.title.slice(0,32) + '…' : worst.item.title;
  const say = [];
  if (added.length > 1) say.push(['santa', `${added.length} wishes in one message?? speedrun. All added, {n}. Let's talk about '{i}' though.`]);
  const pool = worst.a.pool.concat(worst.a.dom);
  if (pool.length){
    const p1 = rnd(pool); say.push(p1);
    const rest = pool.filter(x => x[0] !== p1[0]);
    if (rest.length && Math.random() < .55) say.push(rnd(rest));
  } else {
    const g = worst.item.url ? GENERIC_LINK.concat(GENERIC) : GENERIC;
    const p1 = rnd(g); say.push(p1);
    if (Math.random() < .3){ const rest = GENERIC.filter(x => x[0] !== p1[0]); say.push(rnd(rest)); }
  }
  const t = worst.a.tier;
  if (t >= 3 && Math.random() < (t === 4 ? .9 : .5) && !say.some(s => s[0] === 'wallet')) say.push(['wallet', rnd(WALLET[t])]);

  // extras
  if (/\bplease\b|\bpls\b|\bplz\b/i.test(text)){ bump(who, 5); say.push(['rudolph', "'please' detected. +5 nice points. manners are the cheat code 🎮"]); }
  const letters = text.replace(/[^a-z]/gi,'');
  if (letters.length > 6 && letters === letters.toUpperCase()){ bump(who, -1); say.unshift(['elfie', "WHY ARE WE YELLING"]); }
  if (/!{3,}/.test(text)) say.push(['santa', "Extra exclamation marks do not make the sleigh go faster, {n}."]);
  const twin = S.items.find(x => x.who === other(who) && sim(x.title, worst.item.title));
  if (twin) say.push(['elfie', "🚨 copycat alert: {o} already asked for something like this 👀"]);
  if (mine === 5) say.push(['elfie', `{n} is at 5 wishes. {o} is at ${theirs}. just saying 👀`]);
  if (mine === 10) say.push(['santa', "Wish #10, {n}. Santa is going to need you to pick favourites. ⭐ them in the list."]);
  if (mine === 15) say.push(['wallet', "please stop at 15 🙏"]);
  if (mine === 25) say.push(['rudolph', "the sleigh has a weight limit, {n}"]);

  save();
  say.slice(0, 4).forEach(([f, s]) => bot(f, fill(s, who, short)));
}
function sim(a, b){ a = a.toLowerCase().trim(); b = b.toLowerCase().trim(); return a.length > 3 && b.length > 3 && (a.includes(b) || b.includes(a)); }

  }
  if (act === 'idea') bot('elfie', 'idea for {n}: '.replace('{n}', NAME[S.sender]) + fill(rnd(IDEAS), S.sender) + ' (type it if you want it)');
  if (act === 'lists') openLists(S.sender);
  if (act === 'share') shareLists();
};

/* ============================================================
   Tapbacks (long-press or double-click a bubble)
   ============================================================ */
let pressT = null;
chat.addEventListener('pointerdown', e => {
  const b = e.target.closest('.bubble[data-id],.linkcard[data-id]'); if (!b) return;
  pressT = setTimeout(() => { pressT = null; openReact(b); }, 430);
});
['pointerup','pointerleave','pointercancel','pointermove'].forEach(ev => chat.addEventListener(ev, e => {
  if (ev === 'pointermove' && Math.abs(e.movementY) < 4) return;
  clearTimeout(pressT);
}));
chat.addEventListener('dblclick', e => { const b = e.target.closest('.bubble[data-id],.linkcard[data-id]'); if (b){ e.preventDefault(); openReact(b); } });
chat.addEventListener('contextmenu', e => { if (e.target.closest('.bubble[data-id]')) e.preventDefault(); });
chat.addEventListener('click', e => { if (e.target.closest('.linkcard') && document.querySelector('.react')) e.preventDefault(); });

function openReact(el){
  closeReact();
  const m = S.msgs.find(x => x.id === +el.dataset.id); if (!m) return;
  const r = el.getBoundingClientRect();
  const dim = document.createElement('div'); dim.className = 'dim'; dim.onclick = closeReact;
  const bar = document.createElement('div'); bar.className = 'react';
  const mine = m.tb && m.tb[S.sender];
  bar.innerHTML = ['❤️','👍','👎','😂','‼️','❓'].map(x => `<button class="${mine === x ? 'sel' : ''}" aria-label="React ${x}">${x}</button>`).join('');
  document.body.append(dim, bar);
  const w = bar.offsetWidth;
  bar.style.left = Math.max(8, Math.min(innerWidth - w - 8, r.left + r.width/2 - w/2)) + 'px';
  bar.style.top = Math.max(8, r.top - 58) + 'px';
  bar.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const em = b.textContent;
    m.tb = m.tb || {};
    if (m.tb[S.sender] === em) delete m.tb[S.sender]; else m.tb[S.sender] = em;
    save(); closeReact(); renderChat();
    reactBack(m, em);
  };
}
function closeReact(){ document.querySelectorAll('.react,.dim').forEach(x => x.remove()); }
function reactBack(m, em){
  const who = S.sender;
  if (!m.tb || m.tb[who] !== em || !EMO[m.from] || Math.random() < .35) return;
  const lines = {
    '👎': {santa:"A 👎 on Santa. Bold. -3 nice points, {n}.", elfie:"a thumbs down?? on ME?? I'm telling Santa", rudolph:"i've been disliked before. i was in a whole song about it.", wallet:"honestly fair"},
    '😂': {santa:"Santa is hilarious, thank you for noticing.", elfie:"finally someone gets my humour 💅", rudolph:"i'll be here all week. literally. i live here.", wallet:"I wasn't joking 🥲"},
    '❤️': {santa:"Santa felt that. +1 nice point. ❤️", elfie:"stop it ur making me blush 🥹", rudolph:"🦌❤️", wallet:"finally some love for the wallet"},
    '‼️': {santa:"Santa agrees, this IS important.", elfie:"!!!!", rudolph:"why are we alarmed", wallet:"‼️‼️‼️"},
    '❓': {santa:"What's confusing, {n}? Santa was very clear.", elfie:"don't ❓ me", rudolph:"me neither honestly", wallet:"❓ is how I feel about the list"},
    '👍': {santa:"Glad we agree. 👍", elfie:"👍", rudolph:"👍🦌", wallet:"👍 (nervously)"},
  }[em];
  if (em === '👎' && m.from === 'santa') bump(who, -3);
  if (em === '❤️' && m.from === 'santa') bump(who, 1);
  save();
  bot(m.from, fill(lines[m.from], who));
}

/* ============================================================
   Sheets: wishlists, showdown, group info
   ============================================================ */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim'), shBody = document.getElementById('shBody'), shTitle = document.getElementById('shTitle');
let listTab = 'artin';
function openSheet(kind){ sheetOpen = kind; sheet.classList.add('on'); scrim.classList.add('on'); }
function closeSheet(){ sheetOpen = null; sheet.classList.remove('on'); scrim.classList.remove('on'); }
scrim.onclick = closeSheet; document.getElementById('shDone').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeReact(); closeSheet(); } });

function openLists(tab){ listTab = tab || listTab; shTitle.textContent = 'Wishlists'; renderLists(); openSheet('lists'); }
function renderLists(){
  const tabs = [['artin', NAME.artin], ['elsa', NAME.elsa], ['vs', '⚔️ Showdown']];
  let h = `<div class="seg">${tabs.map(([k,l]) => `<button data-tab="${k}" class="${listTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (listTab === 'vs') h += showdownHTML();
  else {
    const k = listTab, its = S.items.filter(x => x.who === k).sort((a,b) => b.prio - a.prio || a.ts - b.ts);
    h += `<div class="kidhead">${avHTML(k)}<div style="flex:1"><h4>${NAME[k]}</h4>
      <div class="meter"><i style="width:${S.nice[k]}%"></i></div>
      <div class="small">Nice score ${S.nice[k]}/100 · ${niceLabel(S.nice[k])}</div></div></div>`;
    h += its.length ? `<div class="items">${its.map(itemHTML).join('')}</div>`
      : `<div class="items"><div class="empty">No wishes yet. Suspicious. 🤨<br>Type one in the chat.</div></div>`;
    if (its.length) h += `<p class="small" style="text-align:center;margin:8px 0 0">tap a stamp to appeal Santa's verdict · tap ⭐ to set priority</p>`;
  }
  h += `<button class="bigbtn" data-act="share">📤 Send lists to the parents</button>`;
  shBody.innerHTML = h;
}
function itemHTML(it){
  const v = V[it.verdict];
  return `<div class="item">
    <button class="vstamp ${v[2]}" data-appeal="${it.id}" aria-label="Appeal verdict ${v[1]}">${v[0]} ${v[1]}<small>tap to appeal</small></button>
    <div><div class="it-t">${esc(it.title)}</div>${it.url ? `<a class="it-d" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">${esc(it.domain)} ↗</a>` : ''}</div>
    <button class="stars" data-star="${it.id}" aria-label="Priority ${it.prio} of 3">${'⭐'.repeat(it.prio)}${'<span style="opacity:.25">⭐</span>'.repeat(3 - it.prio)}</button>
    <button class="del" data-del="${it.id}" aria-label="Remove">✕</button></div>`;
}
function showdownHTML(){
  const st = k => { const its = S.items.filter(x => x.who === k); return {n: its.length, greed: its.reduce((s,x) => s + x.tier, 0), yes: its.filter(x => x.verdict === 'yes').length, no: its.filter(x => x.verdict === 'no').length}; };
  const a = st('artin'), e = st('elsa');
  const side = (k, s) => `<div class="side">${avHTML(k)}<b>${NAME[k]}</b>
    <div class="stat"><span>Wishes</span><b>${s.n}</b></div><div class="stat"><span>Nice</span><b>${S.nice[k]}</b></div>
    <div class="stat"><span>Greed-o-meter</span><b>${'💸'.repeat(Math.min(5, Math.ceil(s.greed/4))) || '—'}</b></div>
    <div class="stat"><span>✅ / 🚫</span><b>${s.yes} / ${s.no}</b></div></div>`;
  let verdict;
  if (!a.n && !e.n) verdict = "Nobody has wished for anything yet. Santa is bored. 🥱";
  else if (a.greed === e.greed) verdict = "Exactly equal greed levels. Santa is genuinely impressed. And a little scared.";
  else { const g = a.greed > e.greed ? 'artin' : 'elsa'; verdict = `<b>${NAME[g]}</b> is the greedier elf this year 💸<br>Santa's favourite (for now): <b>${fav()}</b>`; }
  return `<div class="vs">${side('artin', a)}<div class="mid">vs</div>${side('elsa', e)}</div><div class="verdict-box">${verdict}</div>`;
}
shBody.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.dataset.tab){ listTab = t.dataset.tab; renderLists(); return; }
  if (t.dataset.act === 'share'){ shareLists(); return; }
  if (t.dataset.act === 'reset'){ resetAll(); return; }
  if (t.dataset.tog){ toggle(t.dataset.tog); return; }
  const id = t.dataset.star || t.dataset.del || t.dataset.appeal;
  const it = S.items.find(x => x.id === id); if (!it) return;
  if (t.dataset.star){
    it.prio = it.prio % 3 + 1;
    const top = S.items.filter(x => x.who === it.who && x.prio === 3).length;
    if (it.prio === 3 && top === 4) bot('elfie', fill("everything can't be top priority, {n}. that's not how priorities work 😭", it.who));
  }
  if (t.dataset.del){
    S.items = S.items.filter(x => x !== it); bump(it.who, 3);
    bot(rnd(['santa','elfie']), fill(rnd(["{n} removed '{i}'. Selfless. Mature. +3 nice points. 🥹","deleted '{i}'?? character development 👏 +3 nice points","'{i}' has left the list. we hardly knew it."]), it.who, it.title.slice(0,30)));
  }
  if (t.dataset.appeal){
    const old = it.verdict; it.verdict = rollVerdict(Math.max(1, it.tier - 1)); bump(it.who, -1);
    const rank = {no:0, maybe:1, yes:2};
    const msg = it.verdict === old ? "Appeal for '{i}' DENIED. The court of Santa has spoken. 🔨"
      : rank[it.verdict] > rank[old] ? "Fine. Your lawyer was convincing. '{i}' upgraded to " + V[it.verdict][0] + " " + V[it.verdict][1]
      : "You appealed '{i}' and it got WORSE. Lesson learned. " + V[it.verdict][0] + " " + V[it.verdict][1];
    bot('santa', fill(msg, it.who, it.title.slice(0,30)));
  }
  save(); renderLists();
});

function openInfo(){
  shTitle.textContent = 'Details';
  const members = ['artin','elsa','santa','elfie','rudolph','wallet'];
  shBody.innerHTML = `<div class="bigav"><div class="stack">${avHTML('artin')}${avHTML('santa')}${avHTML('elsa')}</div><h2>🎄 Wishlist HQ</h2><div class="small">6 people · est. this Christmas</div></div>
    <div class="members">${members.map(k => `<div class="member">${avHTML(k)}<div><b>${NAME[k]}</b><span class="small">${KIDS.includes(k) ? `Nice score ${S.nice[k]}/100 · ${(c => c + (c === 1 ? ' wish' : ' wishes'))(S.items.filter(x => x.who === k).length)}` : ROLE[k]}</span></div></div>`).join('')}</div>
    <div class="members">
      <div class="toggle"><span>❄️ Snow</span><button class="sw ${S.snow ? 'on' : ''}" data-tog="snow" aria-label="Snow"></button></div>
      <div class="toggle"><span>🔄 Faces on the wrong people? Swap them</span><button class="sw ${S.swap ? 'on' : ''}" data-tog="swap" aria-label="Swap faces"></button></div>
    </div>
    <button class="bigbtn" data-act="share">📤 Send lists to the parents</button>
    <button class="bigbtn ghost" data-act="reset">Clear chat & wishlists</button>`;
  openSheet('info');
}
function toggle(k){
  S[k] = !S[k]; save();
  if (k === 'snow') snow.toggle(S.snow);
  if (k === 'swap'){ renderHeader(); renderMe(); renderChat(); }
  openInfo();
}
function resetAll(){
  if (!confirm('Delete the whole chat and both wishlists?')) return;
  S = fresh(); save(); closeSheet(); q = Promise.resolve(); hideTyping(); renderHeader(); renderMe(); intro();
}
async function shareLists(){
  let t = `🎄 CHRISTMAS WISHLISTS ${new Date().getFullYear()} 🎄\n(certified by Santa, Elfie & Rudolph)\n`;
  KIDS.forEach(k => {
    const its = S.items.filter(x => x.who === k).sort((a,b) => b.prio - a.prio || a.ts - b.ts);
    t += `\n${NAME[k].toUpperCase()} — nice score ${S.nice[k]}/100 (${niceLabel(S.nice[k]).replace(/\s\S+$/,'')})\n`;
    t += its.length ? its.map((x,i) => `${i+1}. ${'⭐'.repeat(x.prio)} ${x.title}${x.url ? ' — ' + x.url : ''}  [${V[x.verdict][1]}]`).join('\n') : '(nothing yet... suspicious)';
    t += '\n';
  });
  try { if (navigator.share){ await navigator.share({title:'Christmas Wishlists', text:t}); return; } } catch(e){ if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(t); banner('elfie', 'Lists copied! Paste them to the parents 📤'); }
  catch(e){ prompt('Copy this and send it to the parents:', t); }
}

/* ============================================================
   Header, banner, misc buttons
   ============================================================ */
function renderHeader(){ document.getElementById('hdrStack').innerHTML = avHTML('artin') + avHTML('santa','mid') + avHTML('elsa'); }
document.getElementById('groupBtn').onclick = openInfo;
document.getElementById('listBtn').onclick = () => openLists(S.sender);
document.getElementById('ftBtn').onclick = () => bot('santa', rnd(["Santa declined your FaceTime. Santa is in a meeting with the elves.","Santa doesn't do video before Dec 24. Santa's beard needs prep time.","*Santa is unavailable* (Santa is napping)"]));
document.getElementById('backBtn').onclick = () => bot('elfie', rnd(["there is no escape from this chat 🙂","25 unread messages and you're leaving THIS chat? priorities.","where do you think you're going. we're not done judging."]));
const bannerEl = document.getElementById('banner'); let bannerT;
function banner(from, text){
  bannerEl.innerHTML = `${avHTML(from)}<div><b>${esc(NAME[from])}</b>${esc(text)}</div>`;
  bannerEl.classList.add('on'); clearTimeout(bannerT); bannerT = setTimeout(() => bannerEl.classList.remove('on'), 3200);
}
bannerEl.onclick = () => { bannerEl.classList.remove('on'); closeSheet(); };

/* ============================================================
   Snow
   ============================================================ */
const snow = (() => {
  const cv = document.getElementById('snow'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flakes = [], on = false, raf, col;
  function size(){ const r = cv.parentElement.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width*d; cv.height = r.height*d; cx.setTransform(d,0,0,d,0,0); }
  function seed(){ const r = cv.parentElement.getBoundingClientRect(); flakes = Array.from({length:38}, () => ({x:Math.random()*r.width, y:Math.random()*r.height, r:.7+Math.random()*1.6, s:.3+Math.random()*.8, w:Math.random()*6.28})); }
  function tick(){
    const w = cv.width/(devicePixelRatio||1), h = cv.height/(devicePixelRatio||1);
    cx.clearRect(0,0,w,h); cx.fillStyle = col;
    for (const f of flakes){ f.y += f.s; f.w += .02; f.x += Math.sin(f.w)*.35; if (f.y > h+4){ f.y = -4; f.x = Math.random()*w; } cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.28); cx.fill(); }
    raf = requestAnimationFrame(tick);
  }
  function toggle(v){ on = v && !reduce; cancelAnimationFrame(raf); cx.clearRect(0,0,cv.width,cv.height); col = getComputedStyle(document.documentElement).getPropertyValue('--snow'); if (on){ size(); seed(); tick(); } }
  addEventListener('resize', () => on && size());
  return {toggle};
})();

/* ============================================================
   Boot
   ============================================================ */
function intro(){
  addMsg({from:'sys', text:'Santa added Artin and Elsa to the group.'}, true);
  addMsg({from:'sys', text:'Elfie the Elf named the group “🎄 Wishlist HQ”.'}, true);
  addMsg({from:'santa', kind:'stage', text:''}, true);
  renderChat();
  bot('santa', "Ho ho ho! This is the OFFICIAL wishlist chat. Type a wish or paste a link and Santa adds it to your list.");
  bot('elfie', "and I'll judge it 💅");
  bot('rudolph', "rules: one wish per line. links welcome. 'money' is not a personality.");
  bot('wallet', "hi. please be gentle 🥲");
  bot('santa', "Tap your face down there 👇 to switch between Artin and Elsa. The 📋 up top shows your lists.");
}
/* iPhone keyboard: keep the composer above the keyboard, no page jumping */
(() => {
  const vv = window.visualViewport, phone = document.getElementById('phone');
  const framed = matchMedia('(min-width:700px) and (min-height:760px)');
  if (!vv) return;
  const fit = () => {
    if (framed.matches){ phone.style.height = ''; return; }
    phone.style.height = vv.height + 'px';
    if (window.scrollY) window.scrollTo(0, 0);
    scrollDown();
  };
  vv.addEventListener('resize', fit);
  vv.addEventListener('scroll', () => { if (!framed.matches && window.scrollY) window.scrollTo(0, 0); });
  fit();
})();
renderHeader(); renderMe(); autosize(); snow.toggle(S.snow);
if (!S.msgs.length) intro(); else renderChat();
</script>
