const snow = (() => {
  const cv = document.getElementById('snow'), cx = cv.getContext('2d');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flakes = [], on = false, raf, col;
  function size(){ const r = cv.parentElement.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width*d; cv.height = r.height*d; cx.setTransform(d,0,0,d,0,0); }
  function seed(){ const r = cv.parentElement.getBoundingClientRect(); flakes = Array.from({length:38}, () => ({x:Math.random()*r.width, y:Math.random()*r.height, r:.7+Math.random()*1.6, s:.3+Math.random()*.8, w:Math.random()*6.28})); }
  function tick(){
    const w = cv.width/(devicePixelRatio||1), h = cv.height/(devicePixelRatio||1);
    cx.clearRect(0,0,w,h); cx.fillStyle = col;
    for (const f of flakes){ f.y += f.s; f.w += .02; f.x += Math.sin(f.w)*.35; if (f.y > h+4){ f.y = -4; f.x = Math.random()*w; } cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.28); cx.fill(); }
    raf = requestAnimationFrame(tick);
  }
  function toggle(v){ on = v && !reduce; cancelAnimationFrame(raf); cx.clearRect(0,0,cv.width,cv.height); col = getComputedStyle(document.documentElement).getPropertyValue('--snow'); if (on){ size(); seed(); tick(); } }
  addEventListener('resize', () => on && size());
  return {toggle};
})();

/* ============================================================
   Santa's AI brain, running on the phone itself (WebLLM + WebGPU).
   Free, no limits, no login, messages never leave the device.
   The rule brain still handles wishes and lists; the AI brain does the talking.
   ============================================================ */
const BRAIN_LIB = 'https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.87/+esm';
/* best first; if a phone runs out of memory the next one is tried */
const BRAIN_MODELS = {
  f16: ['Llama-3.2-3B-Instruct-q4f16_1-MLC', 'gemma-2-2b-it-q4f16_1-MLC'],
  f32: ['gemma-2-2b-it-q4f32_1-MLC-1k'],
};
const brain = {state:'off', pct:0, engine:null, busy:false, err:''};
const BAD_WORDS = /\b(fuck|shit|bitch|damn|sex|kill yourself|kys|hell no|stupid kid|fat|ugly)\b/i;

async function brainKind(){
  if (!('gpu' in navigator)) return null;
  try { const a = await navigator.gpu.requestAdapter(); if (!a) return null; return a.features.has('shader-f16') ? 'f16' : 'f32'; }
  catch(e){ return null; }
}
function brainWorker(){
  const code = `import { WebWorkerMLCEngineHandler } from "${BRAIN_LIB}"; const h = new WebWorkerMLCEngineHandler(); self.onmessage = (m) => h.onmessage(m);`;
  return new Worker(URL.createObjectURL(new Blob([code], {type:'text/javascript'})), {type:'module'});
}
async function startBrain(asked){
  if (['checking','loading','ready'].includes(brain.state)) return;
  brain.state = 'checking'; brainUI();
  const kind = await brainKind();
  if (!kind){
    brain.state = 'unsupported'; S.brain = false; save(); brainUI();
    return;
  }
  brain.state = 'loading'; brain.pct = 0; brainUI();
  const progress = r => { brain.pct = Math.round((r.progress || 0) * 100); brain.note = r.text || ''; brainUI(); };
  try {
    const webllm = await import(BRAIN_LIB);
    const chain = BRAIN_MODELS[kind].slice(S.brainModel ? Math.max(0, BRAIN_MODELS[kind].indexOf(S.brainModel)) : 0);
    let lastErr = null;
    for (const model of chain){
      try {
        try { brain.engine = await webllm.CreateWebWorkerMLCEngine(brainWorker(), model, {initProgressCallback: progress}); }
        catch(e){ if (/memory|OOM|allocate|device lost|exceed/i.test(String(e && e.message || e))) throw e; brain.engine = await webllm.CreateMLCEngine(model, {initProgressCallback: progress}); }
        brain.model = model; S.brainModel = model; lastErr = null; break;
      } catch(e){ lastErr = e; brain.engine = null; brain.pct = 0; brainUI(); }
    }
    if (lastErr || !brain.engine) throw lastErr || new Error('no model');
    brain.state = 'ready'; S.brain = true; save(); brainUI();
  } catch(e){
    brain.state = 'error'; brain.err = String(e && e.message || e).slice(0, 200); brainUI();
  }
}

const VOICES = {
  santa: {name:'Santa', intro:'You are Santa Claus texting in a family group chat with two kids. You are warm, funny and a little dramatic, and you call yourself "Santa".',
    ex:[['Elsa','im so tired today','Maybe because SOMEONE stayed up late again? 😴 Santa sees everything. Early bedtime tonight!'],['Artin','santa do you play basketball',"Santa has a deadly jump shot. Santa also has 1,700-year-old knees. Let's call it a tie. 🏀"]]},
  elfie: {name:'Elfie', intro:'You are Elfie, a sarcastic teenage elf texting in a family group chat with two kids. You write in lowercase, short and dry.',
    ex:[['Elsa','i got a new hoodie',"the closet is already full. where is it even gonna live"],['Artin','i scored 20 points today','ok mr. NBA 😤 proud of u but the elves still saw u skip homework']]},
  rudolph: {name:'Rudolph', intro:'You are Rudolph the reindeer texting in a family group chat with two kids. You are dry and deadpan, with very short sentences.',
    ex:[['Artin','rudolph are you fast','faster than you on a school morning.'],['Elsa','do you like snow',"I live in it. it's fine. my nose keeps me warm."]]},
};
function pickVoice(text){
  if (/rudolph|reindeer|\bdeer\b/i.test(text)) return 'rudolph';
  if (/elfie|\belf\b/i.test(text)) return 'elfie';
  if (/santa/i.test(text)) return 'santa';
  const r = Math.random(); return r < .55 ? 'santa' : r < .85 ? 'elfie' : 'rudolph';
}
function brainPrompt(who, text, voice){
  const v = VOICES[voice];
  const list = k => itemsOf(k).map(x => `${x.title} (${x.verdict === 'yes' ? 'approved' : x.verdict === 'no' ? 'nemikhad' : 'pending'})`).join(', ') || 'nothing yet';
  const chatLines = S.msgs.filter(m => m.from !== 'sys' && m.kind !== 'stage' && m.kind !== 'chips' && m.text).slice(-7, -1)
    .map(m => `${SHORT[m.from] || m.from}: ${m.text.replace(/\n/g, ' ').slice(0, 160)}`).join('\n');
  return `${v.intro} Text like a real person: one or two short sentences, under 25 words, plain words, at most one emoji. No "Ah"/"Oh" openers, no "Ho ho ho", no dashes, no *actions*, no hashtags, no slang like "bestie" or "it's giving". Be kind and family-friendly; tease gently. Never say you are an AI or a bot. Never promise that a kid will get a gift: Santa only decides on Christmas.
Facts about the kids: Artin (older brother) loves basketball and money, but if a gift is expensive he says "why did u spend so much". He sometimes annoys his sister. Elsa (younger sister) is obsessed with trends (squishies this year, Labubu last year), her room is messy, and she can't wake up early for school. They live near Toronto. The kids' dad always says "na na na nemikhad" (Farsi for "no no no, you don't need it") and Santa borrowed it.
Wishlists: Artin: ${list('artin')}. Elsa: ${list('elsa')}.

Examples of the style (don't repeat them):
${v.ex.map(([a, b, c]) => `${a}: ${b}\n${v.name}: ${c}`).join('\n')}

Recent chat:
${chatLines}
${NAME[who]}: ${text}

Write only ${v.name}'s next text, replying directly to ${NAME[who]}.`;
}
function cleanBrain(out, voice){
  const v = VOICES[voice];
  let t = String(out || '').split('\n').map(x => x.trim()).filter(x => x && !/^(artin|elsa)\s*:/i.test(x)).join(' ');
  t = t.replace(/^(santa|elfie|elfie the elf|rudolph)\s*[:：]\s*/i, '').replace(/\*\*/g, '').replace(/^["“]+|["”]+$/g, '').trim();
  if (t.length < 2 || t.length > 260) return null;
  if (v.ex.some(e => t.toLowerCase().includes(e[2].toLowerCase().slice(0, 25)))) return null;  // parroted an example
  return humanize(t, voice);
}
/* use the AI brain for conversation when it's ready; otherwise the canned lines */
async function reply(who, text, fallback){
  const voice = pickVoice(text), rc = FAM.replyChat;
  if (navigator.onLine !== false){
    for (const p of TALK_CHAIN){
      if (resting(p)) continue;
      await q; showTyping(voice, rc);
      try {
        const out = cleanBrain(await callChat(p, brainPrompt(who, text, voice), p.ms, false), voice);
        hideTyping(); FAM.replyChat = rc;
        if (out){ bot(voice, out); lastSource = p.model; return; }
        restFor(p, 20000);
      } catch(e){ hideTyping(); restFor(p, e && e.status === 429 ? 60000 : 30000); }
    }
  }
  if (brain.state === 'ready' && !brain.busy){
    brain.busy = true;
    await q; showTyping(voice, rc);
    try {
      const r = await brain.engine.chat.completions.create({
        messages:[{role:'user', content: brainPrompt(who, text, voice)}], temperature: 0.8, top_p: 0.95, max_tokens: 70,
      });
      hideTyping();
      const out = cleanBrain(r.choices && r.choices[0] && r.choices[0].message && r.choices[0].message.content, voice);
      FAM.replyChat = rc;
      if (out){ bot(voice, out); lastSource = 'on-phone AI'; return; }
    } catch(e){ hideTyping(); }
    finally { brain.busy = false; }
  }
  lastSource = 'built-in'; FAM.replyChat = rc;
  talk(fallback, who);
}

async function famLoad(){

  if (window.FB_EMULATOR){
    fb.connectAuthEmulator(FAM.auth, 'http://' + window.FB_EMULATOR.auth, {disableWarnings:true});
    const [h, port] = window.FB_EMULATOR.firestore.split(':'); fb.connectFirestoreEmulator(FAM.db, h, +port);

async function famStart(){
  const fb = await famLoad();

  fb.onSnapshot(fb.query(famCol('messages'), fb.orderBy('ts'), fb.limitToLast(800)), snap => {
    const fresh = new Set(), first = !FAM.ready;
    const msgs = snap.docs.map(d => { const m = Object.assign({id:d.id}, d.data()); if (!FAM.seen.has(d.id)){ FAM.seen.add(d.id); if (!first) fresh.add(d.id); } return m; }).filter(m => canSee(chatOf(m)));
    S.msgs = msgs; FAM.ready = true;

    if (FAM.view === 'chat') renderChat(fresh);
    renderConvos(); updateBadge();
  }, () => {});
  fb.onSnapshot(famRef('state', 'main'), d => {
    const st = d.data() || {};

    FAM.lastNice = Object.assign({}, S.nice);

  }, () => {});
  fb.onSnapshot(famCol('members'), snap => {
    snap.docs.forEach(d => { FAM.members[d.id] = d.data(); });
    renderHeader(); renderMe(); if (FAM.ready) renderChat();
  }, () => {});
  fb.onSnapshot(famCol('pending'), snap => {
    PEND.items = {};
    snap.docs.forEach(d => { const p = d.data(); if (canSee(p.chat)) PEND.items[d.id] = p; });
    renderPendingNote(); pumpPending();

  setInterval(() => { pumpPending(); renderPendingNote(); }, 3000);

  document.addEventListener('visibilitychange', () => { if (!document.hidden) pumpPending(); });
  fb.onSnapshot(famCol('typing'), snap => {
    snap.docs.forEach(d => { FAM.typing[d.id] = d.data().until || 0; });
    renderRemoteTyping();
  }, () => {});
  setInterval(renderRemoteTyping, 1500);
}

function famPush(){
  if (!FAM.on || !FAM.ready) return;

}

/* ---------- photos ---------- */
async function shrinkPhoto(file, max, q){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
function pickPhoto(){
  return new Promise(res => {
    const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
    inp.onchange = () => res(inp.files && inp.files[0] || null);
    inp.click();
  });
}
async function sendPhoto(){
  here(); const cid = FAM.on ? FAM.chat : null;
  const f = await pickPhoto(); if (!f) return;
  if (FAM.on) FAM.replyChat = cid;
  let src = await shrinkPhoto(f, FAM.on ? 1080 : 720, .72);
  if (src.length > 850000) src = await shrinkPhoto(f, 800, .6);
  const who = me();
  const sentPhoto = addMsg({from: who, kind:'img', src, text:''});
  if (FAM.on){ if (chatKind(cid) !== 'dm') famEnqueue(Object.assign({}, sentPhoto, {text: '(sent a photo)'})); }
  else if (Math.random() < .55) talk([fresh1(isAdult(who) ? PHOTO_ADULT : PHOTO_KID)], who);
}
const PHOTO_KID = [
  ['elfie', "pic received. the elves are zooming in 🔍"], ['santa', "Santa saved that one. Santa saves everything."],
  ['rudolph', "nice. I'd have done a better angle."], ['elfie', "is that a hint about a wish or"], ['santa', "Lovely! Santa is putting it on the North Pole fridge. 📌"]];
const PHOTO_ADULT = [
  ['santa', "Thanks for the photo, {n}! Santa is adding it to the family album. 📸"], ['elfie', "{n} sending pics. this chat is getting fancy"],
  ['rudolph', "good photo. better than the elves' photos."]];
/* blob URLs keep big photos cheap to redraw */
function imgSrc(m){
  const s = m.src || '';
  if (!s.startsWith('data:')) return s;
  if (!FAM.blobs[m.id]){ try { const [h, b] = s.split(','); const bin = atob(b); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); FAM.blobs[m.id] = URL.createObjectURL(new Blob([u], {type: h.slice(5, h.indexOf(';'))})); } catch(e){ return s; } }
  return FAM.blobs[m.id];
}

}

/* ---------- guaranteed replies ----------
   Every message to Santa goes into the family's shared "Santa owes a reply" queue.
   Any family phone that's open picks it up (one at a time, with a lock), asks the AI,
   and only removes it once the real answer is in the chat. If the AI is busy, it waits
   and tries again: no canned or off-topic filler, ever. */
const PEND = {items:{}, busy:false};
function famEnqueue(m){
  if (!FAM.on || !m || !m.id) return;
  const p = {who: m.from, text: m.text || '', chat: chatOf(m), ts: m.ts, tries: 0, next: 0, lease: 0, by: ''};
  PEND.items[m.id] = p;
  FAM.fb.setDoc(famRef('pending', m.id), p).catch(() => {});
  setTimeout(pumpPending, 30);
}
const myUid = () => FAM.auth && FAM.auth.currentUser ? FAM.auth.currentUser.uid : '';
async function claimPending(id){
  const ref = famRef('pending', id), uid = myUid();
  try {
    return await FAM.fb.runTransaction(FAM.db, async tx => {
      const d = await tx.get(ref); if (!d.exists()) return null;
      const p = d.data();
      if ((p.lease || 0) > Date.now() && p.by !== uid) return null;   // another phone is answering it
      if ((p.next || 0) > Date.now()) return null;                     // waiting before the next try
      tx.update(ref, {lease: Date.now() + 60000, by: uid});
      return p;
    });
  } catch(e){ return null; }
}
async function pumpPending(){
  if (!FAM.on || !FAM.ready || PEND.busy || navigator.onLine === false) return;
  const now = Date.now(), uid = myUid();
  const due = Object.entries(PEND.items)
    .filter(([id, p]) => (p.next || 0) <= now && !((p.lease || 0) > now && p.by !== uid))
    .sort((a, b) => a[1].ts - b[1].ts);
  if (!due.length) return;
  PEND.busy = true;
  const id = due[0][0];
  try {
    const p = await claimPending(id);
    if (!p) return;
    const ok = await answerPending(p);
    if (ok){ await q; delete PEND.items[id]; await FAM.fb.deleteDoc(famRef('pending', id)).catch(() => {}); }
    else {
      const tries = (p.tries || 0) + 1;
      const upd = {tries, lease: 0, by: '', next: Date.now() + Math.min(15000, 2500 * tries)};
      Object.assign(PEND.items[id] || {}, upd);
      await FAM.fb.updateDoc(famRef('pending', id), upd).catch(() => {});
    }
  } finally { PEND.busy = false; renderPendingNote(); setTimeout(pumpPending, 250); }
}
async function answerPending(p){
  const input = smartInput(p.who, p.text, p.chat, p.ts);
  await q;
  showTyping('santa', p.chat);
  let r = null;
  try { r = await aiAnswer(input, Date.now() + 50000); } finally { hideTyping(); }
  if (!r) return false;
  FAM.replyChat = p.chat;
  applySmart(r, p.who, p.text);
  return true;
}
function renderPendingNote(){
  let bar = document.getElementById('pendbar');
  if (!bar){ bar = document.createElement('div'); bar.id = 'pendbar'; bar.className = 'pendbar'; document.querySelector('header').after(bar); }
  const old = FAM.on && FAM.view === 'chat' && Object.values(PEND.items).some(p => p.chat === FAM.chat && Date.now() - p.ts > 15000);
  bar.textContent = old ? "🎅 The North Pole connection is taking a moment. Your message is saved and Santa will answer." : '';
  bar.hidden = !old;
}
