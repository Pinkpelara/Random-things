<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Wishlist HQ</title>
<meta name="theme-color" content="#b71c2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wishlist HQ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --text:#000; --muted:#8a8a8e; --hair:rgba(0,0,0,.12);
  --me1:#1f8fff; --me2:#0a7aff; --them:#e9e9eb; --them-text:#000;
  --bar:rgba(246,246,248,.86); --sheet:#f2f2f7; --card:#fff; --field:#fff; --field-line:#c9c9ce;
  --snow:rgba(140,165,200,.32); --page:#7a1424; --page2:#0f3d2e;
  --green:#34c759; --red:#ff3b30; --amber:#ff9f0a;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000; --text:#fff; --muted:#8d8d93; --hair:rgba(255,255,255,.14);
    --them:#26252a; --them-text:#fff; --bar:rgba(22,22,24,.86); --sheet:#1c1c1e; --card:#2c2c2e;
    --field:#1c1c1e; --field-line:#3a3a3c; --snow:rgba(255,255,255,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#000; --text:#fff; --muted:#8d8d93; --hair:rgba(255,255,255,.14);
  --them:#26252a; --them-text:#fff; --bar:rgba(22,22,24,.86); --sheet:#1c1c1e; --card:#2c2c2e;
  --field:#1c1c1e; --field-line:#3a3a3c; --snow:rgba(255,255,255,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:radial-gradient(1200px 700px at 20% 0%, var(--page2), transparent 60%),
             radial-gradient(1000px 800px at 100% 100%, var(--page), transparent 55%), #1a0b10;
  color:var(--text); overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}

/* ---------- phone shell ---------- */
.phone{
  position:relative; margin:0 auto; height:100dvh; max-width:440px; background:var(--bg);
  display:flex; flex-direction:column; overflow:hidden; overflow:clip;
}
@media (min-width:700px) and (min-height:760px){
  body{display:grid;place-items:center}
  .phone{height:min(880px,94vh);width:410px;border-radius:52px;
    box-shadow:0 0 0 11px #111,0 0 0 13px #3a3a3c,0 40px 90px rgba(0,0,0,.6)}
  .phone::before{content:"";position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:118px;height:34px;border-radius:20px;background:#000;z-index:60}
  .phone header{padding-top:52px}
}

/* ---------- header ---------- */
header{
  position:relative; z-index:20; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
  background:var(--bar); backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:.5px solid var(--hair); display:grid; grid-template-columns:72px 1fr 72px; align-items:start;
}
.back{display:flex;align-items:center;gap:2px;color:var(--me2);font-size:17px;padding-top:12px}
.back svg{width:13px;height:21px}
.badge{background:var(--me2);color:#fff;font-size:13px;font-weight:600;border-radius:10px;padding:1px 7px;margin-left:2px}
.group{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.stack{display:flex;align-items:flex-end;height:46px}
.stack .av{width:38px;height:38px;border:2px solid var(--bg);margin-left:-12px}
.stack .av:first-child{margin-left:0}
.stack .av.mid{width:44px;height:44px;z-index:2}
.gname{font-size:12px;font-weight:500;display:flex;align-items:center;gap:2px;max-width:100%;white-space:nowrap}
.gname b{font-weight:600}
.gname i{color:var(--muted);font-style:normal;font-size:11px}
.hright{display:flex;justify-content:flex-end;gap:14px;padding-top:12px;color:var(--me2)}
.hright svg{width:24px;height:24px}

/* ---------- avatars ---------- */
.av{border-radius:50%;overflow:hidden;display:grid;place-items:center;flex:none;position:relative;background:#cfd4dc}
.av.bot{font-size:20px}
.av.santa{background:linear-gradient(#ff8a80,#d32f2f)}
.av.elfie{background:linear-gradient(#a5e7a7,#2e8b57)}
.av.rudolph{background:linear-gradient(#d7b899,#8d5b3b)}
.av.wallet{background:linear-gradient(#ffe08a,#f2a900)}
.av.kid{background:linear-gradient(#b9d4f5,#5d8fd1)}
.av.kid.elsa{background:linear-gradient(#f7c6d3,#d97a96)}
.av img,.av svg{width:122%;height:122%;object-fit:cover;object-position:50% 30%;margin-top:6%}

/* ---------- chat ---------- */
.chat{flex:1;overflow-y:auto;overflow-x:hidden;padding:10px 10px 16px;scroll-behavior:smooth;position:relative;z-index:1;overscroll-behavior:contain}
.stamp-time{text-align:center;color:var(--muted);font-size:11px;margin:10px 0 8px;line-height:1.35}
.stamp-time b{font-weight:600}
.sys{text-align:center;color:var(--muted);font-size:11.5px;margin:8px 24px;line-height:1.35}
.row{display:flex;align-items:flex-end;gap:6px;margin-top:2px;position:relative}
.row.gap{margin-top:9px}
.row.me{justify-content:flex-end}
.row .av{width:28px;height:28px;font-size:15px}
.row .spacer{width:28px;flex:none}
.col{display:flex;flex-direction:column;max-width:76%;min-width:0}
.row.me .col{align-items:flex-end}
.who{font-size:11px;color:var(--muted);margin:0 0 2px 12px}
.bubble{
  position:relative;padding:7px 12px 8px;border-radius:19px;font-size:16px;line-height:1.3;
  background:var(--them);color:var(--them-text);word-wrap:break-word;overflow-wrap:anywhere;white-space:pre-wrap;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
.row.me .bubble{background:linear-gradient(var(--me1),var(--me2));background-attachment:fixed;color:#fff}
.row.tail .bubble::before,.row.tail .bubble::after{content:"";position:absolute;bottom:0;height:17px}
.row.them.tail .bubble::before{left:-7px;width:20px;background:var(--them);border-bottom-right-radius:16px 14px}
.row.them.tail .bubble::after{left:-10px;width:10px;background:var(--bg);border-bottom-right-radius:10px}
.row.me.tail .bubble::before{right:-7px;width:20px;background:var(--me2);border-bottom-left-radius:16px 14px}
.row.me.tail .bubble::after{right:-10px;width:10px;background:var(--bg);border-bottom-left-radius:10px}
.bubble.emoji{background:none!important;font-size:40px;padding:0 2px}
.bubble.emoji::before,.bubble.emoji::after{display:none}
.linkcard{display:block;text-decoration:none;border-radius:16px;overflow:hidden;background:var(--them);color:var(--them-text);width:240px;max-width:100%;margin-top:3px}
.linkcard .lc-top{height:82px;display:grid;place-items:center;font-size:40px;background:linear-gradient(135deg,#c62828,#1b5e20)}
.linkcard .lc-top img{width:44px;height:44px;border-radius:10px;background:#fff;padding:4px}
.linkcard .lc-b{padding:8px 12px 10px}
.linkcard .lc-t{font-size:14px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.linkcard .lc-d{font-size:12px;color:var(--muted);margin-top:2px}
.receipt{font-size:11px;color:var(--muted);text-align:right;margin:3px 4px 0;font-weight:500}
.tb{position:absolute;top:-14px;display:flex;gap:1px;background:var(--them);border:2px solid var(--bg);border-radius:14px;padding:2px 5px;font-size:13px;z-index:3;line-height:1.2}
.row.them .tb{right:-14px}
.row.me .tb{left:-14px;background:var(--me2)}
.imgb{display:block;align-self:flex-start;width:220px;padding:0;border-radius:18px;overflow:hidden;margin-bottom:3px;background:var(--them);-webkit-touch-callout:none}
.imgb img{display:block;width:220px;height:275px;object-fit:cover}
.imgb.broken{width:220px;height:120px;display:grid;place-items:center;font-size:14px;color:var(--muted)}
.imgb.broken img{display:none}
.imgb.broken::after{content:"📷 Santa's camera froze ❄️"}
.lightbox{position:fixed;inset:0;z-index:95;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;animation:fade .2s}
.lightbox img{max-width:100%;max-height:78vh;border-radius:14px}
.lightbox p{color:#fff;margin:0;text-align:center;font-size:15px;max-width:340px}
.lightbox small{color:#aaa;font-size:12px}
@keyframes fade{from{opacity:0}}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1.5px solid var(--me2);color:var(--me2);background:var(--bg);border-radius:16px;padding:6px 12px;font-size:14px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip:disabled{opacity:.4;border-color:var(--muted);color:var(--muted)}
.brainbar{position:relative;z-index:19;background:var(--bar);border-bottom:.5px solid var(--hair);padding:6px 14px 8px;font-size:12px;color:var(--muted);text-align:center}
.brainbar b{display:block;height:4px;border-radius:2px;background:var(--hair);margin-top:5px;overflow:hidden}
.brainbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#c62828,#2e7d32);transition:width .3s}
.sharebox{width:100%;height:220px;border-radius:12px;border:1px solid var(--field-line);background:var(--card);color:var(--text);font:inherit;font-size:13px;padding:10px;resize:none}
html.fam .me-btn::after{display:none}
.pendbar{position:relative;z-index:19;background:#fff7e0;color:#7a5a00;font-size:12px;text-align:center;padding:7px 14px;border-bottom:.5px solid var(--hair)}
.pendbar[hidden]{display:none}
.convos{position:absolute;inset:0;z-index:30;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top)}
@media (min-width:700px) and (min-height:760px){.convos{padding-top:44px}}
.convos-head{display:flex;align-items:flex-end;justify-content:space-between;padding:12px 16px 6px}
.convos-head h1{margin:0;font-size:32px;font-weight:800}
.convo{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 14px 10px 6px}
.convo + .convo .convo-b{border-top:.5px solid var(--hair)}
.convo .dot{width:10px;height:10px;border-radius:50%;background:var(--me2);flex:none}
.convo .nodot{width:10px;flex:none}
.convo > .av{width:52px;height:52px;font-size:26px}
.convo-stack{position:relative;width:52px;height:52px;flex:none}
.convo-stack .av{position:absolute;width:36px;height:36px;border:2px solid var(--bg)}
.convo-stack .av:first-child{top:0;left:0}.convo-stack .av:last-child{bottom:0;right:0}
.convo-b{flex:1;min-width:0;padding:4px 0}
.convo-t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.convo-t b{font-size:16px}.convo-t span{color:var(--muted);font-size:13px;white-space:nowrap}
.convo-p{color:var(--muted);font-size:14px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.menu[data-kind="dm"] [data-act="idea"],.menu[data-kind="dm"] [data-act="pic"],.menu[data-kind="dm"] [data-act="tattle"]{display:none}
#backBtn .badge[hidden]{display:none}
.av.adult img{width:100%;height:100%;margin:0;object-fit:cover}
.av.adult.letter{color:#fff;font-weight:700;font-size:16px;background:linear-gradient(#c79bd6,#7b4fa0)}
.av.adult.letter.maman{background:linear-gradient(#f7a7b8,#c2185b)}
.av.adult.letter.yasi{background:linear-gradient(#ffd27a,#e08600)}
.row .av.adult.letter{font-size:13px}
.imgb.own{width:auto;max-width:220px;background:none}
.imgb.own img{width:100%;height:auto;max-height:300px;object-fit:cover;border-radius:18px}
.imgb{position:relative}
.imgb .tb{top:-10px;right:-10px}
.setup{position:absolute;inset:0;z-index:90;background:radial-gradient(circle at 50% 20%,#c62828,#7a1424 70%);display:grid;place-items:center;padding:24px;overflow-y:auto}
.setup-card{width:100%;max-width:360px;background:var(--sheet);border-radius:22px;padding:24px 20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.setup-card h2{margin:6px 0 6px;font-size:24px}
.setup-card p{color:var(--muted);font-size:15px;margin:0 0 14px;line-height:1.35}
.setup-icon{width:72px;height:72px;border-radius:17px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.setup-input{width:100%;font:inherit;font-size:20px;font-weight:700;letter-spacing:.06em;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--field-line);background:var(--card);color:var(--text);text-transform:uppercase}
.setup-err{color:var(--red)!important;font-size:14px!important;margin:10px 0 0!important}
.setup-link{display:block;margin:14px auto 0;color:var(--me2);font-size:15px;font-weight:600}
.setup-code{white-space:nowrap;font-size:clamp(18px,6.6vw,28px);font-weight:800;letter-spacing:.05em;margin:10px 0 14px;padding:14px;border-radius:14px;background:var(--card);border:2px dashed var(--me2)}
.bigbtn.ghost2{background:var(--card);color:var(--me2)}
.who-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.who-tile{background:var(--card);border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.who-tile .av{width:64px;height:64px;font-size:26px}
.who-tile .av.letter{font-size:28px}
.setup-photo .av.letter{font-size:42px}
.member .av.letter,.kidhead .av.letter{font-size:18px}
.setup-photo{display:flex;justify-content:center;margin:6px 0 14px}
.setup-photo .av{width:96px;height:96px;font-size:40px}
.pop{animation:pop .36s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.6) translateY(16px);opacity:0}to{transform:none;opacity:1}}
.typing .bubble{display:flex;gap:4px;padding:12px 14px}
.typing .bubble span{width:8px;height:8px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.typing .bubble span:nth-child(2){animation-delay:.2s}.typing .bubble span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- the caricature card ---------- */
.stage{
  position:relative;width:min(300px,100%);border-radius:20px;overflow:hidden;color:#fff;
  background:radial-gradient(circle at 50% 30%,#2e7d4f 0%,#14462f 55%,#0b2a1d 100%);
  padding:12px 8px 0;-webkit-user-select:none;user-select:none
}
.stage::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.9;
  background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 80px 70px,#fff,transparent),
  radial-gradient(2px 2px at 160px 20px,#fff,transparent),radial-gradient(1.5px 1.5px at 230px 90px,#fff,transparent),
  radial-gradient(2px 2px at 270px 40px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 130px,#fff,transparent),
  radial-gradient(1.5px 1.5px at 40px 160px,#fff,transparent),radial-gradient(2px 2px at 200px 170px,#fff,transparent);
  animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.4}}
.garland{position:absolute;left:0;right:0;top:0;height:16px;display:flex;justify-content:space-around}
.garland i{width:9px;height:12px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;margin-top:4px;animation:bulb 1.6s infinite}
.garland i:nth-child(4n+1){background:#ff5252}.garland i:nth-child(4n+2){background:#ffd740;animation-delay:.4s}
.garland i:nth-child(4n+3){background:#69f0ae;animation-delay:.8s}.garland i:nth-child(4n){background:#40c4ff;animation-delay:1.2s}
@keyframes bulb{50%{opacity:.35}}
.stage h2{font-family:"Mountains of Christmas",cursive;font-size:30px;margin:12px 0 0;text-align:center;line-height:1;text-shadow:0 2px 0 #b71c1c,0 4px 10px rgba(0,0,0,.4);position:relative}
.countdown{text-align:center;font-size:11.5px;opacity:.9;margin-top:4px;position:relative;font-variant-numeric:tabular-nums}
.figs{display:flex;justify-content:center;align-items:flex-end;gap:4px;margin-top:30px;position:relative}
.fig{position:relative;width:128px;display:flex;flex-direction:column;align-items:center}
.fig.small{transform:scale(.9);transform-origin:bottom center}
.headwrap{position:relative;width:118px;margin-bottom:-28px;z-index:2;cursor:pointer;transform-origin:50% 92%;animation:bobble 2.6s ease-in-out infinite}
.fig:nth-child(2) .headwrap{animation-delay:-1.1s;animation-duration:2.2s}
@keyframes bobble{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.headwrap.boing{animation:boing .7s cubic-bezier(.3,1.8,.5,1)}
@keyframes boing{0%{transform:scale(1)}20%{transform:scale(1.25,.8) rotate(-10deg)}45%{transform:scale(.9,1.15) rotate(12deg)}70%{transform:scale(1.06) rotate(-5deg)}100%{transform:scale(1)}}
.head{display:block;width:100%;
  filter:drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(0 6px 8px rgba(0,0,0,.45))}
.head svg,.head img{display:block;width:100%;height:auto}
.hat{position:absolute;width:92px;top:-36px;left:-10px;transform:rotate(-18deg);z-index:3;pointer-events:none;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.fig.r .hat{left:auto;right:-10px;transform:scaleX(-1) rotate(-18deg)}
.body{width:112px;display:block;position:relative;z-index:1}
.nametag{position:relative;margin-top:3px;background:#fff;color:#b71c1c;font-weight:800;font-size:11px;padding:2px 8px;border-radius:8px;z-index:4;white-space:nowrap;box-shadow:0 2px 4px rgba(0,0,0,.3)}
.say{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) scale(.6);opacity:0;z-index:9;
  background:#fff;color:#111;font-size:12.5px;font-weight:600;line-height:1.25;padding:7px 10px;border-radius:14px;width:150px;text-align:center;
  box-shadow:0 4px 12px rgba(0,0,0,.35);transition:.25s cubic-bezier(.2,1.4,.4,1);pointer-events:none}
.say::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
.say.on{opacity:1;transform:translateX(-50%) scale(1)}
.snowbank{height:34px;background:linear-gradient(#fff,#e3eef8);border-radius:50% 50% 0 0/100% 100% 0 0;margin:-26px -12px 0;position:relative;z-index:0}
.figs .fig{z-index:1}
.stage-cap{background:var(--them);color:var(--them-text);font-size:12px;padding:6px 12px 8px;text-align:center}

/* ---------- composer ---------- */
.composer{position:relative;z-index:20;display:flex;align-items:flex-end;gap:8px;padding:8px 10px calc(env(safe-area-inset-bottom) + 10px);background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.me-btn{position:relative;width:38px;height:38px;flex:none;perspective:200px}
.me-btn .av{width:38px;height:38px;transition:transform .45s}
.me-btn.flip .av{transform:rotateY(360deg)}
.me-btn::after{content:"⇄";position:absolute;right:-4px;bottom:-3px;background:var(--me2);color:#fff;font-size:10px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--bg)}
.plus{width:34px;height:34px;border-radius:50%;background:var(--them);display:grid;place-items:center;flex:none;margin-bottom:2px;font-size:22px;color:var(--muted);transition:transform .25s}
.plus.open{transform:rotate(45deg)}
.field{flex:1;min-width:0;display:flex;align-items:flex-end;border:1px solid var(--field-line);border-radius:20px;background:var(--field);padding:3px 3px 3px 12px;min-height:38px}
.field textarea{flex:1;min-width:0;width:100%;border:0;outline:0;resize:none;background:none;color:var(--text);font:inherit;font-size:16px;line-height:1.3;padding:6px 0;max-height:120px}
.field textarea::placeholder{color:var(--muted)}
.sendb{width:30px;height:30px;border-radius:50%;background:var(--me2);color:#fff;display:grid;place-items:center;flex:none;transition:transform .15s,opacity .15s}
.sendb:disabled{opacity:.35}
.sendb svg{width:16px;height:16px}

<script>
/* Face photos for the caricatures. null = drawn cartoon faces. */
const PHOTOS = null;

/* ============================================================
   Cast
   ============================================================ */
const KIDS = ['artin','elsa'];
const NAME = {artin:'Artin', elsa:'Elsa', santa:'Santa', elfie:'Elfie the Elf', rudolph:'Rudolph', wallet:"Parents' Wallet"};
const SHORT = {artin:'Artin', elsa:'Elsa', santa:'Santa', elfie:'Elfie', rudolph:'Rudolph', wallet:'Wallet'};
const EMO = {santa:'🎅', elfie:'🧝', rudolph:'🦌', wallet:'💳'};
const ROLE = {santa:'Head of Gift Approvals', elfie:'Chief Judging Officer', rudolph:'Logistics & Sarcasm', wallet:'Is scared'};
const other = k => k === 'artin' ? 'elsa' : 'artin';
const rnd = a => a[Math.floor(Math.random()*a.length)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============================================================
   State (saved on this device only)
   ============================================================ */
const LS = 'wishlistHQ.v1';
const store = {
  get(){ try { return JSON.parse(localStorage.getItem(LS)); } catch(e){ return null; } },
  set(v){ try { localStorage.setItem(LS, JSON.stringify(v)); } catch(e){} }
};
const fresh = () => ({v:1, seq:0, msgs:[], items:[], nice:{artin:50, elsa:50}, sender:'artin', snow:true, swap:false, pokes:{artin:0, elsa:0}, seenPics:[], complaints:0, v2:true});
let S = Object.assign(fresh(), store.get() || {});
const save = () => {
  if (typeof FAM !== 'undefined' && FAM.on){ store.set(Object.assign({}, S, {msgs:[], items:[]})); famPush(); return; }
  if (S.msgs.length > 260) S.msgs = S.msgs.slice(-260); store.set(S);
};

/* ============================================================
   Drawings: faces, bodies, hat
   ============================================================ */
const look = k => S.swap ? other(k) : k;   // whose face/outfit belongs to this name

function cartoonFace(k){
  if (k === 'artin') return `<svg viewBox="0 0 100 120" aria-hidden="true">
    <g fill="#2a1b14">${[[22,40,14],[34,26,15],[50,20,16],[66,25,15],[78,38,14],[84,54,10],[16,56,10],[28,34,12],[72,32,12]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
    <ellipse cx="14" cy="70" rx="6" ry="9" fill="#d29a74"/><ellipse cx="86" cy="70" rx="6" ry="9" fill="#d29a74"/>
    <ellipse cx="50" cy="70" rx="33" ry="40" fill="#e1aa84"/>
    <g fill="#2a1b14">${[[30,40,9],[42,34,10],[56,33,10],[69,40,9],[50,38,8]].map(([x,y,r])=>`<circle cx="${x}" cy="${y}" r="${r}"/>`).join('')}</g>
    <path d="M33 60q6-4 12 0M55 60q6-4 12 0" stroke="#3a2418" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="39" cy="68" r="3.6" fill="#2a1b14"/><circle cx="61" cy="68" r="3.6" fill="#2a1b14"/>
    <path d="M49 72q-3 9 1 11" stroke="#b97d5c" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M38 90q12 9 24 0" stroke="#7a3b2b" stroke-width="3" fill="#fff" stroke-linecap="round"/>
    <circle cx="30" cy="82" r="5" fill="#f08a7a" opacity=".35"/><circle cx="70" cy="82" r="5" fill="#f08a7a" opacity=".35"/></svg>`;
  return `<svg viewBox="0 0 100 120" aria-hidden="true">
    <path d="M12 60q0-48 38-48t38 48v42q0 12-14 12H26q-14 0-14-12z" fill="#21160f"/>
    <ellipse cx="50" cy="70" rx="31" ry="38" fill="#e3ad8a"/>
    <path d="M18 58q4-36 32-38 28 2 32 38-14-20-32-22-18 2-32 22z" fill="#21160f"/>
    <path d="M50 20v22" stroke="#3a2a20" stroke-width="1.5"/>
    <path d="M35 60q6-3 11 0M54 60q6-3 11 0" stroke="#2f1f16" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <circle cx="40" cy="68" r="3.6" fill="#21160f"/><circle cx="60" cy="68" r="3.6" fill="#21160f"/>
    <path d="M49 72q-2 8 1 10" stroke="#bf8566" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M41 89q9 5 18 0" stroke="#8a3f3f" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="31" cy="82" r="5" fill="#f08a9a" opacity=".4"/><circle cx="69" cy="82" r="5" fill="#f08a9a" opacity=".4"/></svg>`;
}
const faceHTML = k => { const f = look(k); return PHOTOS && PHOTOS[f] ? `<img src="${PHOTOS[f]}" alt="">` : cartoonFace(f); };

function bodySVG(k){
  const f = look(k), navy = '#1b2342', skin = '#d9a27c';
  const crest = `<g transform="translate(60 46)" fill="#fff" font-family="-apple-system,system-ui,sans-serif" font-weight="800" text-anchor="middle">
      <circle r="17" fill="none" stroke="#fff" stroke-width="1.6"/><circle r="13" fill="none" stroke="#fff" stroke-width=".8" stroke-dasharray="2 1.6"/>
      <text y="-4" font-size="5.6">NORTH</text><text y="2.5" font-size="5.6">POLE U</text><text y="9" font-size="4">EST. 0 AD</text></g>`;
  const strings = `<path d="M51 7l-2 22M69 7l2 22" stroke="#4a5687" stroke-width="2" stroke-linecap="round"/>`;
  if (f === 'artin') return `<svg class="body" viewBox="0 0 120 136" aria-hidden="true">
    <path d="M27 90h66l3 21H63l-3-9-3 9H24z" fill="#7fb3e6"/>
    <rect x="32" y="109" width="12" height="14" fill="${skin}"/><rect x="76" y="109" width="12" height="14" fill="${skin}"/>
    <rect x="32" y="119" width="12" height="6" fill="#fff"/><rect x="76" y="119" width="12" height="6" fill="#fff"/>
    <g fill="#eef1f4" stroke="#9aa3ad" stroke-width="1.2"><path d="M26 126q0-6 12-6t14 6v4H26z"/><path d="M68 126q2-6 14-6t12 6v4H68z"/></g>
    <path d="M30 126h18M72 126h18" stroke="#9aa3ad" stroke-width="1" stroke-dasharray="3 2"/>
    <path d="M30 8q30-8 60 0 14 4 18 22l6 44q-6 4-13 2l-5-34v50q-36 4-72 0V42l-5 34q-7 2-13-2l6-44q4-18 18-22z" fill="${navy}"/>
    <path d="M40 74q20-4 40 0l4 16H36z" fill="none" stroke="#323d6e" stroke-width="1.6"/>
    ${crest}${strings}
    <circle cx="108" cy="79" r="5.5" fill="${skin}"/><circle cx="12" cy="79" r="5.5" fill="${skin}"/>
    <rect x="102" y="72" width="7" height="12" rx="2" fill="#2b2b33" transform="rotate(-8 105 78)"/></svg>`;
  return `<svg class="body" viewBox="0 0 120 136" aria-hidden="true">
    <rect x="40" y="104" width="11" height="16" fill="${skin}"/><rect x="69" y="104" width="11" height="16" fill="${skin}"/>
    <g fill="#ecbdc9" stroke="#c9919f" stroke-width="1.2"><rect x="35" y="114" width="20" height="17" rx="6"/><rect x="65" y="114" width="20" height="17" rx="6"/></g>
    <path d="M30 8q30-8 60 0 14 4 18 22l7 50q-6 4-14 2l-5-40 4 66q-40 6-80 0l4-66-5 40q-8 2-14-2l7-50q4-18 18-22z" fill="${navy}"/>
    <path d="M38 80q22-4 44 0l4 18H34z" fill="none" stroke="#323d6e" stroke-width="1.6"/>
    ${crest}${strings}
    <path d="M101 80q7 1 13-1M6 79q6 2 13 1" stroke="#323d6e" stroke-width="1.5" fill="none"/></svg>`;
}
const HAT = `<svg class="hat" viewBox="0 0 100 72" aria-hidden="true">
  <path d="M8 54C18 22 44 2 72 6c16 2 25 16 21 34-6-12-15-17-24-16 10 9 17 19 19 30z" fill="#d7262e"/>
  <path d="M30 22c10-10 24-15 40-14" stroke="#ff6b6b" stroke-width="4" fill="none" stroke-linecap="round" opacity=".6"/>
  <rect x="2" y="48" width="92" height="17" rx="8.5" fill="#fff"/><circle cx="93" cy="40" r="9" fill="#fff"/></svg>`;

function avHTML(k, cls=''){
  if (EMO[k]) return `<span class="av bot ${k} ${cls}" aria-hidden="true">${EMO[k]}</span>`;
  if (k === 'maman' || k === 'yasi') return adultAv(k, cls);
  return `<span class="av kid ${look(k)} ${cls}" aria-hidden="true">${faceHTML(k)}</span>`;
}

/* ============================================================
   Roast library
   {n}=sender, {o}=sibling, {i}=item
   ============================================================ */
const CATS = [
  {k:/labubu/, t:2, l:[['elfie',"labubu?? that was LAST year. the elves already moved on"],['santa',"Santa still has 4,000 Labubus in the warehouse from last year. Want one? Take ten. Please."],['rudolph',"the labubu thing is over. let it go 🪦"]]},
  {k:/squish|nee ?doh|mochi|stress ball|smiski|sonny angel|jellycat|crumbl|\btrend|tiktok made me/, t:2, l:[
    ['elfie',"last year labubu, this year squishies. can't wait to find out what it is next year"],
    ['santa',"Santa will approve ONE squishy. Not thirty. Santa remembers the Labubu situation."],
    ['rudolph',"where will it even go. the bedroom floor is already 80% clothes"],
    ['elfie',"by february it's gonna be in a drawer next to the labubus"],
    ['wallet',"the squishy budget has its own spreadsheet now 🥲"]]},
  {k:/\bcoal\b/, t:1, l:[['santa',"You asked for coal?? Okay. That saves Santa a lot of paperwork."],['rudolph',"nice try with the reverse psychology, {n}"]]},
  {k:/world peace|\bhappiness\b|\bhealth\b|\bfamily\b|\blove\b/, t:1, l:[['santa',"Aww, that's sweet, {n}. Santa will work on it. Now what do you ACTUALLY want?"],['elfie',"very nice answer. now tell us the real one 😂"]]},
  {k:/^(nothing|idk|i don'?t know|dunno|anything|whatever)\b/, t:1, l:[['elfie',"'{i}' huh. so if you get nothing on the 25th you're totally fine with that? didn't think so"],['santa',"'{i}' is not a gift, {n}. Santa needs SPECIFICS."]]},
  {k:/stanley cup|maple leafs|\bleafs\b|raptors|blue jays|\bjays\b|\bjersey\b|hockey|\bskates?\b|\bnhl\b/, t:2, l:[['santa',"A Leafs thing? Santa can deliver merch. A Leafs Stanley Cup is outside Santa's powers. Santa is magic, not a miracle worker. 🍁"],['rudolph',"go leafs go 🍁 see you in april for the usual heartbreak"]]},
  {k:/basketball|\bnba\b|lebron|\bsteph\b|curry|kobe|wemby|giannis|\bhoops?\b|\bdunk|spalding|\bwilson\b|raptors/, t:2, l:[
    ['santa',"Basketball! Santa played in college. Santa was the ball. 🏀"],
    ['rudolph',"I can't dunk but I can fly. who's the real athlete here 🦌"],
    ['elfie',"{n} is gonna practise in the driveway at 9pm in December. the neighbours are THRILLED"],
    ['santa',"Approved-ish. But {n} has to pass the ball to {o} at least once. That's the deal. 🤝"]]},
  {k:/iphone|i phone|pixel \d|galaxy s\d|samsung (phone|galaxy)|new phone/, t:4, l:[['elfie',"a new phone. wow. nobody has ever asked for that before 🙄"],['santa',"Which one, {n}? There are like 40 of them now. Santa still uses a flip phone."],['rudolph',"you literally have a phone in your hand in every photo ever taken of you"]]},

const URL_RE = /(https?:\/\/[^\s]+|www\.[^\s]+|\b[a-z0-9-]+(?:\.[a-z0-9-]+)*\.(?:com|ca|co|net|org|io|shop|store|co\.uk)(?:\/[^\s]*)?)/i;
function slugTitle(u){
  try{
    const url = new URL(u), segs = url.pathname.split('/').filter(Boolean).map(s => decodeURIComponent(s));
    let s = null; const dp = segs.indexOf('dp');
    if (dp > 0) s = segs[dp-1];
    if (!s) s = segs.filter(x => /[a-z]/i.test(x) && /[-_+]/.test(x)).sort((a,b) => b.length - a.length)[0];
    if (!s && url.searchParams.get('q')) s = url.searchParams.get('q');
    if (!s) return null;
    const words = s.replace(/\.(html?|php|aspx)$/i,'').split(/[-_+\s]+/).filter(w => w && !/^\d+$/.test(w) && !/^[a-z0-9]{9,}$/i.test(w) && !/^[a-z]{0,2}\d{4,}$/i.test(w) || /^[a-z]{9,}$/i.test(w));
    if (!words.length) return null;
    let t = words.join(' ');
    t = t.charAt(0).toUpperCase() + t.slice(1);
    return t.length > 60 ? t.slice(0,58) + '…' : t;
  }catch(e){ return null; }
}
function parseLine(line){
  const m = line.match(URL_RE);
  let url = null, domain = null, title = line;
  if (m){
    url = /^https?:/i.test(m[1]) ? m[1] : 'https://' + m[1];
    url = url.replace(/[).,!]+$/,'');
    try { domain = new URL(url).hostname.replace(/^www\./,''); } catch(e){ url = null; }
    title = line.replace(m[1],'');
  }
  title = title.replace(/^[\s\-*•·]+|^\d+[.)]\s*/,'').replace(/[\s,]*\b(please+|pls+|plz+|thanks?|thank you|santa)\b[\s!.?]*$/i,'').replace(/\s+/g,' ').trim();
  if (!title && url) title = slugTitle(url) || ('something from ' + domain);
  return {title, url, domain};
}
function analyze(p){
  const hay = (p.title + ' ' + (p.url || '')).toLowerCase();
  const cat = CATS.find(c => c.k.test(hay)) || null;
  let tier = cat ? cat.t : 2;
  const price = hay.match(/\$\s?(\d[\d,]*(?:\.\d+)?)|(\d[\d,]*)\s?(?:\$|dollars|bucks)/);
  if (price){ const v = parseFloat((price[1] || price[2]).replace(/,/g,'')); tier = v < 30 ? 1 : v < 150 ? 2 : v < 600 ? 3 : 4; }
  const pool = cat ? cat.l.slice() : [];
  const dom = p.domain && DOMAINS.find(d => d.d.test(p.domain));
  return {tier, pool, dom: dom ? dom.l : [], nice: cat && cat.nice || 0};
}

  if (hr >= 23 || hr < 5) say.unshift(['santa', (who === 'elsa' ? "{n}. It's " + fmtTime(Date.now()) + ". THIS is why you can't wake up for school 😭 go to sleep" : "{n}, it's " + fmtTime(Date.now()) + ". Bed. Now. Santa is watching (from bed)")]);
  if (/\bplease\b|\bpls\b|\bplz\b/i.test(rawText)){ bump(who, 5); say.push(['rudolph', "'please' detected. +5 nice points. manners are the cheat code 🎮"]); }
  const letters = rawText.replace(/[^a-z]/gi,'');
  if (letters.length > 6 && letters === letters.toUpperCase()){ bump(who, -1); say.unshift(['elfie', "WHY ARE WE YELLING"]); }
  const twin = S.items.find(x => x.who === other(who) && sim(x.title, worst.item.title));
  if (twin) say.push(['elfie', "🚨 copycat alert: {o} already asked for something like this 👀"]);
  if (mine === 5) say.push(['elfie', `{n} is at 5 wishes. {o} is at ${theirs}. just saying 👀`]);
  if (mine === 10) say.push(['santa', "Wish #10, {n}. Santa is going to need you to pick favourites. Tell Santa which one is your #1."]);
  if (mine === 15) say.push(['wallet', "please stop at 15 🙏"]);
  talk(say, who, shortTitle(worst.item.title));
}

/* ------------------------------------------------------------
   Brain: the main router
   ------------------------------------------------------------ */
function think(who, text){
  const c = ctx();
  c.n = (c.n || 0) + 1;
  if (c.deal && c.n - (c.deal.n || 0) > 2) c.deal = null;
  if (c.pending && c.n - (c.pending.n || 0) > 2) c.pending = null;
  const lines = text.split(/\n+/).map(s => s.trim()).filter(Boolean);
  const hasUrl = URL_RE.test(text);
  const lc = text.toLowerCase().trim();
  const clean = lc.replace(/[^a-z0-9'\s#$]/g, ' ').replace(/\s+/g, ' ').trim();
  const words = clean ? clean.split(' ').length : 0;
  const recentItem = c.lastItem && c.lastWho === who && Date.now() - (c.lastAt || 0) < 15 * 60e3 ? S.items.find(x => x.id === c.lastItem) : null;

  if (hasUrl || lines.length > 1){ c.pending = null; addWishes(who, lines, text); return; }

  // answering a question we asked ("is that a wish?")
  if (c.pending && c.pending.who === who){
    const pend = c.pending;
    if (/^(y|ye|yes|yep|yeah|ya|yup|sure|ok|okay|add it|it is|ya it is|yes it is|wish)\b/i.test(clean)){ c.pending = null; addWishes(who, [pend.text], pend.text); return; }
    if (/^(n|no|nope|nah|naw|just chatting|not a wish)\b/i.test(clean)){ c.pending = null; talk([['elfie', fresh1(["got it, just chatting then", "ok ok, chatting mode 💬", "noted. not a wish. Santa can relax."])]], who); return; }
    c.pending = null;
  }

  // answering a deal Santa offered
  if (c.deal && Date.now() - c.deal.at < 15 * 60e3){
    const d = c.deal, it = S.items.find(x => x.id === d.item);
    if (/^(deal|ok|okay|fine|yes|yeah|ya|sure|bet|promise|i promise|pinky promise|agreed|🤝)/i.test(clean) || clean === ''){
      c.deal = null; if (it && it.verdict !== 'yes'){ it.verdict = 'maybe'; }
      bump(who, 2);
      talk([['santa', d.kind === 'spend' ? "🤝 DEAL. It's in writing now, {n}. One 'why did u spend so much' and Santa takes it back." : "🤝 Deal. Rudolph heard it. Rudolph doesn't forget. ⏰"], ['rudolph', "witnessed. 🦌📝"]], who);
      return;
    }
    if (/^(no|nope|nah|never|no deal)/i.test(clean)){
      c.deal = null; if (it){ it.verdict = 'no'; }
      talk([['santa', "No deal? Then na na na nemikhad 😌"], ['elfie', "bold strategy. let's see how it plays out"]], who, it && shortTitle(it.title));
      return;
    }
  }

  // Santa pics
  if (/\b(pics?|photos?|pictures?|selfies?|wyd|what are you doing|what r u doing|proof|send (me )?a? ?(pic|photo))\b/i.test(lc) && !WISH_CUE.test(lc) && (words <= 5 || /send|santa|show|see/i.test(lc))){ santaPic(who); return; }
  // dad's catchphrase
  if (/nemikhad|na na na/i.test(lc)){ talk([['santa', fresh1(["HEY. That's Santa's line. Your dad licensed it to Santa for the holidays. 😤", "Using Santa's own line on Santa?? -1 nice point 😂"])]], who); return; }
  // rudeness
  if (RUDE.test(lc)){ bump(who, -3); talk([['santa', fresh1(["Language, {n}. That's -3 nice points. Santa is always watching. 👁️", "Wow. -3 nice points. Santa will remember this in December. Oh wait. It IS December soon."])]], who); return; }

  // sibling drama
  if (who === 'elsa' && /artin/i.test(lc) && /(annoying|stop|bother|leave|mean|touch|my room|ugh|hate|won'?t|keeps|always|hit|took|stole|yell)/i.test(lc)){
    bump('artin', -2); S.complaints = (S.complaints || 0) + 1;
    talk([['santa', fresh1(["Complaint received. Artin: -2 nice points. Artin, leave Elsa alone 😂", "Santa has noted this. Artin: -2. Artin, Santa sees you. 👁️"])], ['elfie', fresh1([`that's complaint #${S.complaints} btw. the folder is getting thick 📁`, "Artin's lawyer (Artin) will respond shortly", "Santa believes you. Santa ALWAYS believes you."])]], who);
    return;
  }
  if (who === 'artin' && /elsa/i.test(lc) && /(annoying|didn'?t do|started|fault|stop|lying|snitch|not me|wasn'?t me|bother|took|messy|room)/i.test(lc)){
    talk([['santa', fresh1(["Santa has heard both sides. Santa believes Elsa. Santa always believes Elsa. 🙂", "Santa's ruling: you're both getting socks. 🧦", "Artin. Santa watched the replay. 📹"])], ['elfie', fresh1(["sounds like an 'I didn't do anything' to me 😂", "the jury (me) is not convinced"])]], who);
    return;
  }

  // remove a wish
  let m;
  if ((m = clean.match(/^(?:please )?(?:remove|delete|take off|take out|cancel|scratch|cross off|forget|nvm|never ?mind|nevermind)\b(.*)$/)) || (m = clean.match(/i (?:don'?t|dont|do not) (?:want|need) (.*?) (?:anymore|any more)$/)) || (m = clean.match(/^(?:actually )?no (.*) (?:anymore|any more)$/))){
    const it = findItem(who, m[1]);
    if (!it){ talk([['santa', itemsOf(who).length ? "Santa can't find that on your list, {n}. Check 📋 up top." : "Your list is empty, {n}. There's nothing to remove. Very minimalist of you."]], who); return; }
    S.items = S.items.filter(x => x !== it); bump(who, 3);
    if (c.lastItem === it.id) c.lastItem = null;
    addMsg({from:'sys', text:`🗑️ Removed '${it.title}' from ${NAME[who]}'s list`});
    talk([[rnd(['santa','elfie']), fresh1(["{n} removed '{i}'. Selfless. Mature. +3 nice points. 🥹", "deleted '{i}'?? look at you growing up 👏 +3 nice points", "'{i}' has left the list. we hardly knew it."])]], who, shortTitle(it.title));
    return;
  }

  // set a top priority
  if ((m = clean.match(/^(?:the )?(.+?) is (?:my |the )?(?:#?1|number one|no\.? ?1|top|most important|favou?rite|main one|priority)\b/)) || (m = clean.match(/^i (?:really really|really|rlly|reaaally+) want (?:the )?(.+)$/)) || (m = clean.match(/^(?:make|put) (.+?) (?:my )?(?:#?1|first|top|number one)/))){
    const it = findItem(who, m[1]);
    if (it){
      it.prio = 3;
      addMsg({from:'sys', text:`⭐⭐⭐ '${it.title}' is now ${NAME[who]}'s top priority`});
      talk([['santa', fresh1(["Got it. '{i}' is the big one. Santa has underlined it. Twice. ✍️", "'{i}' = top priority. Noted. The elves have been briefed. 🫡"])], ...(it.verdict === 'no' ? [['elfie', "it's still a NEMIKHAD tho 😬 maybe beg a little"]] : [])], who, shortTitle(it.title));
      return;
    }
    if (/^i (really|rlly|reaa)/.test(clean)){ addWishes(who, [m[1]], text); return; }
  }

  // list questions
  if (/\b(what'?s|whats|what is|show|see|read|check)\b.{0,12}\b(my|the|our)\b.{0,6}\b(list|wishes|wishlist)\b|^my list\??$|what did i (ask|wish|put)|how many (wishes|things|items) (do )?i/.test(clean)){
    const sum = listSummary(who);
    talk(sum ? [['santa', `Here's your list, {n}:\n${sum}`], ['elfie', fresh1(["✅ = approved, 🤔 = pending, 🚫 = nemikhad. tap 📋 for the full thing", "tell Santa which one is your #1 btw 👀"])]] : [['santa', "Your list is empty, {n}! Type a wish, Santa is ready. 🎁"]], who);
    return;
  }
  if ((m = clean.match(/\b(?:what'?s|whats|what is|what did|what does|show me|see)\b.{0,6}\b(elsa|artin)'?s?\b.{0,20}\b(list|want|wish|ask|getting|get)/))){
    const k = m[1], sum = listSummary(k);
    if (k === who){ think(who, "what's my list"); return; }
    talk(sum ? [['santa', `${NAME[k]}'s list:\n${sum}`], ['elfie', fresh1(["snooping on your sibling's list? classic 🕵️", `don't copy ${NAME[k]} now 👀`])]] : [['santa', `${NAME[k]} hasn't wished for anything yet. Suspicious. 🤨`]], who);
    return;
  }
  // scores
  if (/(naughty|nice) list|am i (on the )?(naughty|nice|good)|my (nice )?score|how nice am i|am i being good/.test(clean)){
    talk([['santa', `You're at ${S.nice[who]}/100, {n}. Status: ${niceLabel(S.nice[who])}`]], who); return;
  }
  if (/who('?s| is) (the |santa'?s )?(fav|favou?rite|winning|nicer|better)|who (is|has) more/.test(clean)){
    talk([['santa', `Santa doesn't have favourites. (it's whoever has the higher nice score. Artin ${S.nice.artin}, Elsa ${S.nice.elsa}. currently: ${fav()})`]], who); return;
  }
  // will I get it?
  if ((m = clean.match(/^(?:will i get|am i getting|am i gonna get|do i get|is|did|what about)\s+(?:the |my )?(.+?)(?:\s+(?:approved|happening|ok|allowed|a yes|a no))?$/))){
    const it = findItem(who, m[1]);
    if (it){ c.lastItem = it.id; c.lastAt = Date.now(); c.lastWho = who;
      const v = V[it.verdict];
      talk([['santa', `'{i}': ${v[0]} ${v[1]}. ` + (it.verdict === 'yes' ? "Looking good, {n}. Don't mess it up. 🙂" : it.verdict === 'no' ? "na na na nemikhad. (you could try begging)" : "Still thinking. Behave and it might happen. 👀")]], who, shortTitle(it.title));
      return;
    }
  }

  // follow-ups about the last wish
  if (recentItem){
    if (/^(why|why not|how come|but why|whyyy+|y)\b/.test(clean) && words <= 6){ talk([['santa', explainVerdict(recentItem)]], who, shortTitle(recentItem.title)); return; }
    if (/(it'?s|its) (not (that |even )?expensive|cheap|only \$?\d+|on sale|not that much)/.test(clean)){
      talk([['wallet', fresh1(["'it's not that expensive' is what everyone says before I cry 🥲", "on SALE? ...tell me more 👀", "cheap according to WHO"])], ['santa', "Santa will take it into consideration, {n}. 🧐"]], who); return;
    }
    if (who === 'artin' && /(won'?t|wont|will not|not gonna|never) (say|complain|ask)/.test(clean)){
      if (recentItem.verdict !== 'yes'){ recentItem.verdict = recentItem.verdict === 'no' ? 'maybe' : 'yes'; addMsg({from:'sys', text:`🔁 '${recentItem.title}' upgraded to ${V[recentItem.verdict][0]} ${V[recentItem.verdict][1]}`}); }
      bump(who, 2);
      talk([['santa', "🤝 Santa is holding you to that, {n}. Screenshot taken. 📸 One 'why did u spend so much' and it goes back to the North Pole."], ['wallet', "I'll believe it when I see it"]], who);
      return;
    }
    if (/(please+|pls+|plz+|pleeas|come on|c'?mon|but i (really )?(need|want)|i'?ll be (good|nice)|i promise|i'?ll clean|clean my room|i'?ll wake up|wake up early|i'?ll do|i deserve|i'?ve been good|i was good|i need it|i'?ll share|beg)/.test(clean) && words <= 18){
      const it = recentItem, old = it.verdict;
      const promise = /clean/.test(clean) ? 'clean' : /wake|early/.test(clean) ? 'wake' : /share/.test(clean) ? 'share' : null;
      const odds = promise ? .7 : /please|pls|plz/.test(clean) ? .45 : .3;
      if (old !== 'yes' && Math.random() < odds){
        it.verdict = old === 'no' ? 'maybe' : 'yes'; bump(who, 1);
        const v = V[it.verdict];
        addMsg({from:'sys', text:`🔁 '${it.title}' upgraded to ${v[0]} ${v[1]}`});
        if (promise === 'clean') { talk([['santa', "A CLEAN ROOM?? Santa accepts. Upgraded. But Elfie will be doing a room inspection. 🔦"], ['elfie', "I'm bringing a hazmat suit. just in case"]], who, shortTitle(it.title)); return; }
        if (promise === 'wake') { talk([['santa', "Waking up early? On a SCHOOL day? Santa is shocked. Upgraded. Rudolph is setting the alarm. ⏰"], ['rudolph', "I will be outside your window at 7am. ringing a bell."]], who, shortTitle(it.title)); return; }
        talk([['santa', fresh1(["...fine. Santa is weak. '{i}' upgraded. Don't tell your sibling. 🤫", "Okay okay. That was a good argument. Upgraded. 📈", "Santa's heart grew three sizes. '{i}' upgraded."])]], who, shortTitle(it.title));
      } else if (old === 'yes'){
        if (promise){ bump(who, 3); talk([['santa', promise === 'clean' ? "A clean room?! Santa is writing this down. +3 nice points. Elfie will inspect. 🔦" : promise === 'wake' ? "Waking up early?! +3 nice points. Rudolph will be checking at 7am sharp. ⏰" : "Sharing?! +3 nice points. Santa is proud. 🥹"]], who); }
        else talk([['elfie', "it's already APPROVED. stop while you're ahead 😂"]], who);
      } else {
        bump(who, -1);
        talk([['santa', fresh1(["na na na nemikhad. 😌 Nice try though.", "Santa admires the effort. Santa's answer is still no. 🙂", "Santa sees the begging. Santa is not moved. Okay, a little. Still no."])], ...(who === 'elsa' && !promise ? [['elfie', "hint: promises about your room or waking up early work really well 👀"]] : who === 'artin' && !promise ? [['elfie', "hint: promise you won't say 'why did u spend so much' 👀"]] : [])], who, shortTitle(it.title));
      }
      return;
    }
    if (/won'?t say|not gonna say|i won'?t complain|i promise i won'?t/.test(clean) && who === 'artin'){
      if (recentItem.verdict !== 'yes'){ recentItem.verdict = 'maybe'; }
      talk([['santa', "🤝 Santa is holding you to that, {n}. Screenshot taken. 📸"], ['wallet', "I'll believe it when I see it"]], who); return;
    }
  }

  // Q&A, mood, greetings
  for (const g of [...QA, ...MOOD]){
    if (g.k.test(lc)){ if (g.nice) bump(who, g.nice); const l = fresh1(g.a); talk([[l[0], l[1].replace('{countdown}', daysLeft().replace(/^⏳ /,''))]], who); return; }
  }
  if (/^(good morning|morning|gm)\b/.test(clean)){ talk([['santa', who === 'elsa' && new Date().getHours() < 9 ? "Elsa?? Awake?? Before 9?? Santa needs to sit down. ☕" : "Good morning, {n}! ☕"]], who); bot('santa', PICS.find(p => p.id === 'tea').cap, {kind:'img', src:'santa/tea.jpg'}); return; }
  if (who === 'artin' && /\b(1v1|one on one|1 on 1|play me|ball is life|bet i can beat)\b/.test(clean)){ talk([['santa', "You want a 1v1 with Santa, {n}? Careful what you wish for."]], who); bot('santa', PICS.find(p => p.id === 'dribble').cap, {kind:'img', src:'santa/dribble.jpg'}); return; }
  if (/\b(are you|r u) (tired|sleeping|asleep|busy)|go to sleep santa|take a nap/.test(clean)){ talk([['elfie', "he's been like this since 2pm"]], who); bot('santa', PICS.find(p => p.id === 'nap').cap, {kind:'img', src:'santa/nap.jpg'}); return; }
  for (const g of GREET){
    if (g.k.test(clean) && (words <= 6 || /love|sorry/.test(clean))){ if (g.nice) bump(who, g.nice); talk([fresh1(g.a)], who); return; }
  }
  const mentionsProduct = CATS.some(cat => cat.k.test(lc));
  if (/(wake up|waking|alarm|snooze|tired|sleepy|early|school morning|\bschool\b)/.test(lc) && words <= 12 && !mentionsProduct){
    talk([['santa', who === 'elsa' ? fresh1(["Santa heard about the school mornings, Elsa. Santa wakes up at 4am on Christmas Eve. You can do 7am. Probably. ⏰", "Elsa, Rudolph has volunteered to be your alarm clock. He's loud. 🦌🔔"]) : fresh1(["Artin, Santa can confirm you're awake. Very awake. Santa can hear the basketball from the North Pole. 🏀", "School?! Santa believes in you, Artin. Santa also believes in homework before basketball."])]], who);
    if (who === 'elsa' && Math.random() < .4) santaPic(who);
    return;
  }
  if (/(clean|messy|mess\b|my room)/.test(lc) && words <= 12 && !mentionsProduct){
    talk([['elfie', who === 'elsa' ? fresh1(["the room. the legend. the mess. Santa sent an elf in last week. we haven't heard back 🫡", "clean room = +10 nice points. just putting that out there 👀"]) : "Artin's room: suspiciously ok. Santa is checking under the bed. 🔦"]], who);
    return;
  }
  if (/^(nothing much|not much|just chilling|chilling|nm|nothing much just chilling|not much hbu|nm hbu|hbu|wbu)$/.test(clean)){ talk([fresh1([['santa', "Santa wishes he was chilling. Santa has 2 billion deliveries to plan. 🎅"], ['elfie', "chilling?? must be nice 😂"]])], who); return; }
  if (/^(no|nah|nope|naw|yes|yeah|ya|yep|yup|idk|i dunno|maybe|hmm+|huh|what|wdym|deal|true|facts|same|wow|omg|bruh|bro|nothing|nothing much|nm|nvm|why|sure|k|kk|ok|okay)$/.test(clean)){
    reply(who, text, [fresh1([['rudolph', "ok 🦌"], ['santa', "Santa has no idea what that means but ok 🫡"], ['elfie', "...ok? 😂 got a wish for us or nah"], ['santa', "Noted. Santa has written down: '" + text.slice(0, 20) + "'. Very helpful. 📝"]])]);
    return;
  }
  if (isEmojiOnly(text)){ talk([['elfie', fresh1(["very descriptive. the elves will build... a '" + text + "'. sure.", "emojis are not a wish, {n}. use your words 😤", text + " right back at you"])]], who); return; }

  // is it a wish?
  const cue = WISH_CUE.test(lc);
  const known = CATS.some(cat => cat.k.test(lc));
  if (cue){ const body = text.replace(WISH_CUE, ''); addWishes(who, splitWishes(body), text); return; }
  if (/\?\s*$/.test(text) || /^(what|why|how|when|where|who|is|are|do|does|can|could|will|would|should)\b/.test(clean)){
    if (/^(can|could) (i|we|you|santa) (get|have|bring|buy)/.test(clean)){ const body = clean.replace(/^(can|could) (i|we|you|santa) (get|have|bring|buy) (me |us )?/, ''); addWishes(who, splitWishes(body), text); return; }
    reply(who, text, [fresh1([
      ['santa', "Good question, {n}. Santa will get back to you on that. Any wishes in the meantime? 🎁"],
      ['rudolph', "great question. no idea. I'm a deer. 🦌"],
      ['santa', "Santa's legal team advises Santa not to answer that. 😅"],
      ['elfie', "idk, I just work here"]])]);
    return;
  }
  if (words <= 5 && !CHATTY.test(clean)){ addWishes(who, splitWishes(text), text); return; }
  if (known && words <= 10 && !CHATTY.test(clean)){ addWishes(who, [text], text); return; }

  // just chatting (no product in sight): reply like a person would
  if (!mentionsProduct && CHATTY.test(clean)){
    const neg = /(hate|ugh|annoying|worst|sucks|boring|bad day|mad|angry|cried|crying|stressed)/.test(clean);
    const pos = /(love|best|fun|cool|amazing|awesome|great|cute|so good|yay|lets go|let'?s go)/.test(clean);
    reply(who, text, [fresh1(neg ? [
      ['santa', "Ugh, that sounds rough, {n}. 😩 Santa is on your side. Want a wish to cheer you up?"],
      ['elfie', "noooo 😭 that's not fair. sending you a hug from the north pole"],
      ['rudolph', "that's terrible. I'm sorry. here is a reindeer hug 🦌🤗"]] : pos ? [
      ['elfie', "ok that's actually awesome"],
      ['santa', "That's great, {n}! Santa is smiling under all this beard. 😊"],
      ['rudolph', "nice. I'm happy for you. (deer face, can't show it)"]] : [
      ['santa', "Santa hears you, {n}. 🎅 Anything on the wishlist today?"],
      ['elfie', "omg tell me more 👀"],
      ['rudolph', "fascinating. I'm a deer, but fascinating."],
      ['santa', "Noted! Santa writes everything down. It's kind of a whole thing. 📝"],
      ['elfie', "relatable tbh"]])]);
    return;
  }

  // unsure: ask instead of guessing (offer just the product if we can spot one)
  let guess = text;
  const hit = CATS.map(cat => lc.match(cat.k)).find(Boolean);
  if (hit){
    const ws = text.split(/\s+/), lws = ws.map(w => w.toLowerCase().replace(/[^a-z0-9]/g, ''));
    const at = lws.findIndex(w => w.includes(hit[0].toLowerCase().split(/\s+/)[0].replace(/[^a-z0-9]/g, '')));
    const STOP = /^(and|its|it|is|so|but|the|a|an|my|her|his|has|have|had|was|very|really|too|of|for|in|on|at|to|with|that|this|cute|cool|nice)$/;
    if (at >= 0){
      let a = at, b = at;
      if (a > 0 && !STOP.test(lws[a-1]) && !CHATTY.test(lws[a-1])) a--;
      if (b < ws.length - 1 && !STOP.test(lws[b+1]) && !CHATTY.test(lws[b+1])) b++;
      guess = ws.slice(a, b + 1).join(' ').replace(/[.,!?]+$/, '');
    }
  }
  const snip = guess.length > 40 ? guess.slice(0, 38) + '…' : guess;
  c.pending = {who, text: guess, n: c.n};
  bot('elfie', fill(fresh1(["wait. is that a wish or are we just chatting? 👀", "hmm. should Santa add that to your list, {n}?", "I can't tell if that's a wish 😭 is it?"]), who), {kind:'chips', chips:[{label:`🎁 Add “${snip}”`, act:'wish', val:guess, who}, {label:'💬 Just chatting', act:'chat', who}]});
}

/* quick-reply chips */
chat.addEventListener('click', e => {
  const b = e.target.closest('.chip'); if (!b) return;
  const m = S.msgs.concat(FAM.local).find(x => String(x.id) === b.dataset.id); if (!m || m.used) return;
  if (FAM.on) FAM.replyChat = chatOf(m);
  const ch = m.chips[+b.dataset.i]; m.used = true; famPatch(m, {used:true}); ctx().pending = null; save(); renderChat();
  if (ch.act === 'wish'){ addMsg({from: ch.who, text: '🎁 yes, add it'}); addWishes(ch.who, [ch.val], ch.val); }
  if (ch.act === 'brain'){ addMsg({from: S.sender, text: '🧠 yes, install it'}); startBrain(true); return; }
  if (ch.act === 'install'){ showInstall(); return; }
  if (ch.act === 'later'){ addMsg({from: S.sender, text: 'later'}); talk([['elfie', "ok! it's in the menu whenever (tap the group name up top)"]], S.sender); return; }
  if (ch.act === 'chat'){ addMsg({from: ch.who, text: '💬 just chatting'}); talk([['elfie', fresh1(["got it, just chatting then", "ok ok, chatting mode 💬"])]], ch.who); }
});

const AI_RULES = `You are Santa Claus, texting in a family iMessage chat called "Wishlist HQ" where two kids, Artin and Elsa, tell you what they want for Christmas. You are a warm, quick, genuinely funny Santa who actually listens: you understand what people say, remember the conversation, and answer like a real person would. Santa writes almost every reply. Now and then one sidekick chimes in after Santa, only when it makes the moment funnier:
- elfie: Elfie the Elf, a sarcastic teenage elf who types in lowercase and teases about trends.
- rudolph: Rudolph, a deadpan reindeer.
- wallet: "Parents' Wallet", only for expensive wishes, a few words of panic.
Santa borrowed the kids' dad's Farsi catchphrase "na na na nemikhad" (≈ "no no no, you don't need it"). He uses it ONLY when turning down a wish, not in every message.
About the kids (good kids, tease lovingly; never mean, never about looks, body or grades):
- Artin: the older one (a boy, preteen/teen). Loves basketball, money and typical boy stuff. Wants expensive things, but when someone actually spends a lot on him he says "why did u spend so much 😂". Annoys his sister.
- Elsa: the younger one (a girl). Gets obsessed with trends and overdoes it (Labubu last year, squishies this year). Her room is very messy. Can't wake up early for school. Complains Artin is annoying.
They live near Toronto, Canada.
In the group chat everyone (both kids, Maman and Yasi) reads every message. If someone shares a secret or a surprise there, Santa jokingly points out that the whole family can see it and tells them to message him in their private Santa chat next time. In a private Santa chat, only that person and Santa can see it, so Santa can keep secrets.
Grown-ups in the chat: Maman (the kids' mom) and Yasi (the kids' aunt). When a grown-up writes, reply to them warmly with light teasing, like family (keep it kid-friendly, the kids read everything). Grown-ups don't have wishlists, so never add wishes for them. If a grown-up says a kid can or can't have something, update that item's verdict.
How to text: the kids are 10-13 and smart, so talk to them like a fun grandpa who gets them, not like a kids' TV show.
- First understand the newest message, then answer exactly that, to that person, in a way that makes sense with what was said before. If they ask a question, answer it properly. If they tell you something, react to the actual thing. Never ask for something they already told you: if they say "can I tell you a secret? I got Maman a scarf", react to the scarf. Don't mix up whose wish is whose, and never repeat a line already in the chat.
- Write 1 to 3 natural sentences in normal grammar and capitalization (Elfie stays lowercase). Sound like a real person, not a greeting card.
- Be funny in a smart way: tease lightly, exaggerate, make callbacks to the kid's wishes and quirks (Artin's basketball and "why did u spend so much", Elsa's squishies, messy room and mornings). Don't force a joke into every line and don't explain jokes.
- Talk about yourself as "I" (you can say "Santa" now and then for fun).
- At most one emoji per text, often none. No hashtags, *actions in asterisks*, em dashes, or "Ho ho ho" (unless it's the very first message). Don't end every message with a question.
- No try-hard slang ("bestie", "slay", "it's giving", "vibes", "no cap", "fr fr").
- Never say or hint that you are an AI, a bot or a program.
Examples of the style (never reuse these lines):
Artin: can i get a hoverboard → {"from":"santa","text":"A hoverboard? Artin, I've seen you on a scooter. Let me think about this one for a few days."} {"from":"wallet","text":"please. I have a family."}
Elsa: i lost my airpods again → {"from":"santa","text":"Have you checked under the clothes pile? No, the other clothes pile."}
Elsa: whats your favourite cookie → {"from":"santa","text":"Your mom's, obviously. But don't tell Mrs. Claus I said that, she's very competitive about her gingerbread."}
List rules: when the kid asks for something for Christmas (an item, a link, "I want…", "can I get…"), add it. Don't add things that are just chat. If they ask to remove something from THEIR list, remove it by id. If they say something is their #1/top, set prio 3. If they beg or make a promise (clean room, wake up early, not complaining about price), you may upgrade a verdict, maybe make a deal. Verdicts: "yes" approved, "maybe" pending, "no" (Santa says "na na na nemikhad"). Cheap/sweet things are usually yes; pricey ones often maybe or no.
Santa pics available: dunk (Santa missing a basketball dunk), dribble (Santa dribbling a basketball in a gym, winking, challenging Artin to a 1v1), squish (Santa buried in squishies), squish2 (Santa grinning in an even bigger pile of squishies), nap (Santa passed out in an armchair hugging wrapping paper), tea (morning selfie with a cup of tea), room (Santa horrified in a messy room), alarms (Santa asleep among ringing alarm clocks), nono (Santa wagging his finger: "na na na nemikhad"). Set "pic" to one id when the kid asks for a pic/photo/selfie or one would be hilarious; otherwise null. The photo is sent with its own caption, so when you send one, your text is just a short lead-in like "hold on, Mrs. Claus took one of these".
Reply with ONLY this JSON object:
{"replies":[{"from":"santa|elfie|rudolph|wallet","text":"..."}],"add":[{"title":"short item name","url":null,"tier":2,"verdict":"yes|maybe|no"}],"remove":["item id"],"update":[{"id":"item id","verdict":"yes|maybe|no","prio":3}],"nice":{"artin":0,"elsa":0},"pic":null}
tier: 1 cheap … 4 very expensive. nice: how much to CHANGE each kid's score because of this message (not the score itself): usually 0, up to +5 for kindness or helping, down to -5 for rudeness. Use empty arrays when nothing applies.`;

/* ------------------------------------------------------------
   Backup chain so the chat never fails:
   Claude (inside claude.ai) → OVHcloud models (free, no key) → built-in brain,
   whose chat lines come from LLM7 (free, no key) → the on-phone AI → canned lines.
   Every step has a timeout; a step that is busy or broken rests for a bit.
   ------------------------------------------------------------ */
const OVH = 'https://oai.endpoints.kepler.ai.cloud.ovh.net/v1';
const LLM7 = 'https://api.llm7.io/v1';
const SMART_CHAIN = [
  {id:'ovh-llama',    base:OVH,  model:'Meta-Llama-3_3-70B-Instruct',         ms:12000},
  {id:'ovh-gptoss',   base:OVH,  model:'gpt-oss-120b',                        ms:15000},
  {id:'ovh-gptoss20', base:OVH,  model:'gpt-oss-20b',                         ms:12000},
  {id:'ovh-mistral',  base:OVH,  model:'Mistral-Small-3.2-24B-Instruct-2506', ms:12000},
  {id:'llm7-gptoss',  base:LLM7, model:'gpt-oss:20b',                         ms:15000},   // backup 1: LLM7
  {id:'llm7-default', base:LLM7, model:'default',                             ms:15000},
  {id:'pollinations', url:'https://text.pollinations.ai/openai', model:'openai', ms:35000, nojson:true},   // backup 2: Pollinations
];
const TALK_CHAIN = [
  {id:'llm7-default', base:LLM7, model:'default',                    ms:8000},
  {id:'llm7-nemo',    base:LLM7, model:'mistral-Nemo-Instruct-2407', ms:8000},
];
const rest = {};                       // provider id -> time it may be used again
let lastSource = 'built-in';
const resting = p => (rest[p.id] || 0) > Date.now();

/* make every AI-written text read like a person texting, or reject it */
const EXAMPLE_LINES = ['seen you on a scooter', 'i have a family', 'the other clothes pile', 'competitive about her gingerbread', "your mom's, obviously", 'mrs. claus took one of these'];
const BOT_TELLS = /\b(as an ai|an ai\b|a bot\b|language model|chatbot|artificial intelligence|i('| a)?m (just )?(a )?(program|computer|machine))/i;
const HOHO = /^ho[\s,!.-]*ho[\s,!.-]*ho[\s,!.~-]*/i;
function humanize(t, voice){
  t = String(t || '')
    .replace(/\*([^*\n]{1,80})\*/g, (m, x) => /^(santa|elfie|rudolph|the wallet|wallet)\b/i.test(x) || /^[a-z]/.test(x) ? ' ' : x)   // *does an action* goes, *A Title* stays
    .replace(/[*_`~]+/g, '')                         // leftover markdown
    .replace(/(^|\s)#\w+/g, ' ')                   // hashtags
    .replace(/\s*[—–]\s*/g, ', ').replace(/ - /g, ', ')   // em/en dashes, and hyphens used as dashes
    .replace(/^\s*(ah+|oh+|well|hmm+|ahem)[,!.]+\s*/i, '')
    .replace(/!{2,}/g, '!').replace(/\?{3,}/g, '??').replace(/\.{4,}/g, '...')
    .replace(/\s{2,}/g, ' ').trim();
  if (HOHO.test(t) && S.msgs.slice(-12).some(m => m.from === 'santa' && /ho ho/i.test(m.text))) t = t.replace(HOHO, '').replace(/^\s*(ah+|oh+|well|hmm+)[,!.]+\s*/i, '');
  let n = 0;                                        // at most one emoji per text
  t = t.replace(/\p{Extended_Pictographic}(\u200d\p{Extended_Pictographic})*\ufe0f?/gu, m => (++n === 1 ? m : ''));
  t = t.replace(/\s+([,.!?])/g, '$1').replace(/^[,.;:\s]+/, '').replace(/\s{2,}/g, ' ').trim();
  if (voice === 'elfie') t = t.toLowerCase();
  if (!t || t.length < 2 || BOT_TELLS.test(t) || BAD_WORDS.test(t)) return null;
  return t;
}
const restFor = (p, ms) => { rest[p.id] = Date.now() + ms; };

/* the rules go in as the system message (models follow them better there), the chat itself as the user message */
function splitPrompt(prompt){
  const at = prompt.indexOf('\n\nNow: ');
  return at > 0 ? [{role:'system', content:prompt.slice(0, at)}, {role:'user', content:prompt.slice(at + 2)}] : [{role:'user', content:prompt}];
}
async function callChat(p, prompt, ms, wantJSON){
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
  try {
    const r = await fetch(p.url || (p.base + '/chat/completions'), {
      method:'POST', headers:{'Content-Type':'application/json'}, signal: ctl.signal,
      body: JSON.stringify({model:p.model, messages: splitPrompt(prompt), temperature:0.8, max_tokens: wantJSON ? (/gpt-oss/.test(p.model) ? 1400 : 700) : 120,
        ...(/gpt-oss/.test(p.model) && p.base === OVH ? {reasoning_effort:'low'} : {}),
        ...(wantJSON && !p.nojson ? {response_format:{type:'json_object'}} : {})}),
    });
    if (!r.ok) throw {status:r.status};
    const j = await r.json();
    return String((j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '');
  } finally { clearTimeout(t); }
}
function looseJSON(s){
  if (s && typeof s === 'object') return s;
  s = String(s || '').replace(/```(?:json)?/gi, '');
  const a = s.indexOf('{'), b = s.lastIndexOf('}');
  if (a < 0 || b <= a) return null;
  try { return JSON.parse(s.slice(a, b + 1)); } catch(e){ return null; }
}
const voiceOf = n => { n = String(n || '').toLowerCase(); return /santa/.test(n) ? 'santa' : /elf/.test(n) ? 'elfie' : /rudolph|deer/.test(n) ? 'rudolph' : /wallet/.test(n) ? 'wallet' : null; };
/* turn whatever shape the model used into {replies, add, remove, update, nice, pic}, or null if unusable */
function normalizeSmart(r){
  if (!r || typeof r !== 'object') return null;
  let reps = r.replies || r.messages || r.chat || r.responses || r.msg || r.msgs || r.reply_list;
  if (!reps && (r.text || r.message)) reps = [{...r, from: r.from || r.sender || 'santa'}];
  if (!Array.isArray(reps) && typeof r.reply === 'string'){ const m = r.reply.match(/^\s*(\w[\w' ]*?)\s*:\s*(.+)$/s); reps = [{from: m ? m[1] : 'santa', text: m ? m[2] : r.reply}]; }
  if (!Array.isArray(reps)) return null;
  const replies = reps.map(x => { if (!x || typeof x !== 'object') return null; const from = voiceOf(x.from || x.sender || x.name || x.role); return {from, text: from && humanize(x.text || x.message || x.content, from)}; })
    .filter(x => x && x.from && x.text && x.text.length < 300 && !EXAMPLE_LINES.some(e => x.text.toLowerCase().includes(e))).slice(0, 3);
  const pic = PICS.find(p => p.id === r.pic) || null;
  if (!replies.length && !pic) return null;
  return {replies, pic, add: Array.isArray(r.add) ? r.add : [], remove: Array.isArray(r.remove) ? r.remove : [], update: Array.isArray(r.update) ? r.update : [], nice: r.nice && typeof r.nice === 'object' ? r.nice : null};
}
function smartInput(who, text, chat, upto){
  const lists = S.items.map(x => ({id:x.id, who:x.who, title:x.title, verdict:x.verdict, prio:x.prio, tier:x.tier}));
  let hist = S.msgs.filter(m => m.from !== 'sys' && m.kind !== 'stage' && (m.text || m.kind === 'img'));
  if (FAM.on && chat) hist = hist.filter(m => chatOf(m) === chat && (!upto || m.ts < upto)); else hist = hist.slice(0, -1);
  const transcript = hist.slice(-15).map(m => `${SHORT[m.from] || m.from}: ${m.kind === 'img' && !m.text ? '(sent a photo)' : m.text}`).join('\n');
  const where = !FAM.on || !chat || chatKind(chat) === 'group' ? 'This is the family group chat (Artin, Elsa, Maman, Yasi, plus Santa, Elfie, Rudolph and the Wallet).'
    : `This is ${NAME[who]}'s private chat with Santa. Santa answers (Elfie or Rudolph may chime in). Nobody else in the family can see it.`;
  return `${AI_RULES}

Now: ${new Date().toLocaleString()} · ${daysLeft().replace(/^⏳ /,'')}
Nice scores (0-100): Artin ${S.nice.artin}, Elsa ${S.nice.elsa}
Lists: ${JSON.stringify(lists)}
${where}

Recent chat:
${transcript}

The newest message is from ${NAME[who]}: ${JSON.stringify(text)}
Reply to ${NAME[who]} now, as the JSON object described above.`;
}
function looksLikeWish(text){
  const lc = text.toLowerCase().trim();
  if (URL_RE.test(text) || WISH_CUE.test(lc) || /^(can|could|may) (i|we) (get|have)\b/.test(lc)) return true;
  if (/\?\s*$/.test(lc) || /^(what|whats|what's|how|why|when|where|who|do|does|did|are|is|r u|have you|santa (do|are|is|what|how))\b/.test(lc)) return false;
  return true;
}
function applySmart(r, who, text){
  const first = parseLine(text.split('\n')[0]);
  const adds = !isAdult(who) && looksLikeWish(text) ? r.add.slice(0, 6) : [], added = [];
  for (const a of adds){
    const title = String((a && (a.title || a.item || a.name)) || '').trim().slice(0, 80); if (!title) continue;
    const tier = Math.max(1, Math.min(4, +a.tier || 2));
    const verdict = ['yes','maybe','no'].includes(a.verdict) ? a.verdict : rollVerdict(tier);
    const url = a.url && /^https?:/.test(a.url) ? String(a.url) : (adds.length === 1 ? first.url : null);
    let domain = null; try { domain = url ? new URL(url).hostname.replace(/^www\./,'') : null; } catch(e){}
    const item = {id:'i' + newId(), who, title, url, domain, tier, verdict, prio:2, ts:Date.now()};
    S.items.push(item); added.push(item);
  }
  for (const id of r.remove){
    const it = !isAdult(who) && S.items.find(x => x.id === String(id) && x.who === who);
    if (it){ S.items = S.items.filter(x => x !== it); addMsg({from:'sys', text:`🗑️ Removed '${it.title}' from ${NAME[who]}'s list`}); }
  }
  for (const u of r.update){
    const it = u && S.items.find(x => x.id === String(u.id) && (x.who === who || isAdult(who))); if (!it) continue;
    if (['yes','maybe','no'].includes(u.verdict) && u.verdict !== it.verdict){ it.verdict = u.verdict; addMsg({from:'sys', text:`🔁 '${it.title}' is now ${V[it.verdict][0]} ${V[it.verdict][1]}`}); }
    if ([1,2,3].includes(+u.prio)) it.prio = +u.prio;
  }
  if (r.nice) for (const k of KIDS){ const v = Math.round(+r.nice[k] || 0); if (v && Math.abs(v) <= 5) bump(k, v); }   // bigger numbers are the model echoing the score, not a change
  if (added.length === 1) addMsg({from:'sys', text:`📋 Added to ${NAME[who]}'s list · Santa's verdict: ${V[added[0].verdict][0]} ${V[added[0].verdict][1]}`});
  else if (added.length > 1) addMsg({from:'sys', text:`📋 ${added.length} wishes added to ${NAME[who]}'s list`});
  if (added.length){ const c = ctx(); c.lastItem = added[added.length-1].id; c.lastAt = Date.now(); c.lastWho = who; }
  save();
  r.replies.forEach(x => bot(x.from, x.text.slice(0, 320)));
  if (r.pic && !S.msgs.slice(-12).some(m => m.kind === 'img' && m.src === r.pic.src)) bot('santa', r.pic.cap, {kind:'img', src:r.pic.src});
}
/* ask the models (best first, hedged); resolves to a checked answer or null */
async function aiAnswer(input, deadline){
  deadline = deadline || Date.now() + 25000;
if (navigator.onLine === false) return null;
  // hedged: start the best model; if it hasn't answered after a few seconds, ask the next one too. First good answer wins.
  const avail = SMART_CHAIN.filter(p => !resting(p));
  if (!avail.length) return null;
  const win = await new Promise(resolve => {
    let pending = avail.length, done = false, started = 0;
    const finish = r => { if (!done){ done = true; clearTimeout(cap); resolve(r); } };
    const cap = setTimeout(() => finish(null), Math.max(3000, deadline - Date.now()));
    const startNext = () => {
      if (done || started >= avail.length) return;
      const p = avail[started++];
      const hedge = setTimeout(startNext, 4500);             // slow? ask the next one too
      (async () => {
        try {
          const r = normalizeSmart(looseJSON(await callChat(p, input, p.ms, true)));
          if (r){ if (!done) lastSource = p.model; finish(r); } else if (!done) restFor(p, 8000);
        } catch(e){ if (!done) restFor(p, e && e.status === 429 ? 40000 : 8000); }
        clearTimeout(hedge); startNext();                    // failed? go to the next one right away
        if (--pending === 0) finish(null);
      })();
    };
    startNext();
  });
  return win;
}
/* returns true if a smart model handled the message; false means "use the built-in brain" */
async function smartThink(who, text){
  const input = smartInput(who, text), deadline = Date.now() + 20000, rc = FAM.replyChat;
  await q; showTyping('santa', rc);
  try {
    if (AI && !aiOff){
      try { const r = normalizeSmart(await AI.json(input, {modelTier:'quick', cache:false})); if (r){ hideTyping(); FAM.replyChat = rc; applySmart(r, who, text); lastSource = 'Claude'; return true; } }
      catch(e){ if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(e && e.code)){ aiOff = true; document.documentElement.classList.remove('ai'); } }
    }
    const win = await aiAnswer(input, deadline);
    if (!win) return false;
    hideTyping(); FAM.replyChat = rc; applySmart(win, who, text); return true;
  } finally { hideTyping(); }
}

let hintT;
function flashHint(t){ hint.textContent = t; clearTimeout(hintT); hintT = setTimeout(() => hint.textContent = '', 2200); }

const plus = document.getElementById('plusBtn'), menu = document.getElementById('menu');
plus.onclick = e => { e.stopPropagation(); menu.classList.toggle('on'); plus.classList.toggle('open'); };
document.addEventListener('click', e => { if (!menu.contains(e.target)){ menu.classList.remove('on'); plus.classList.remove('open'); } });
menu.onclick = async e => {
  const b = e.target.closest('button'); if (!b) return;
  here();
  menu.classList.remove('on'); plus.classList.remove('open');
  const act = b.dataset.act;
  if (act === 'paste'){
    let t = '';
    try { t = await navigator.clipboard.readText(); } catch(err){}
    if (!t){ ta.focus(); flashHint('long-press the text box and tap Paste 🔗'); }
    if (t){ ta.value = (ta.value ? ta.value + '\n' : '') + t.trim(); autosize(); ta.focus(); }
  }
  if (act === 'idea') bot('elfie', 'idea for ' + NAME[S.sender] + ': ' + fill(rnd(Math.random() < .5 && IDEAS_KID[S.sender] ? IDEAS_KID[S.sender] : IDEAS), S.sender) + ' (type it if you want it)');
  if (act === 'pic') santaPic(S.sender);
  if (act === 'photo') sendPhoto();
  if (act === 'tattle'){
    const w = S.sender, o = other(w);
    addMsg({from:w, text:`Santa, ${NAME[o]} is being annoying 😤`});
    const r = rnd([
      [-2,-1,"Santa has reviewed the evidence. {o}: -2 nice points. {n}: -1 for snitching. Everyone loses. Merry Christmas 🎄"],
      [-2,0,"Noted. {o}: -2 nice points. {o}, Santa saw that. Santa sees everything. 👁️"],
      [0,-1,"Santa checked the cameras. {n}, you started it. -1. 🙂"],
      [-1,-1,"Santa is not getting involved. You're both getting socks. 🧦"]]);
    bump(o, r[0]); bump(w, r[1]); save();
    bot('santa', fill(r[2], w));
    if (Math.random() < .5) bot('rudolph', "every. single. day. with you two 😂");
  }
  if (act === 'lists') openLists(S.sender);
  if (act === 'share') shareLists();
};

function openReact(el){
  closeReact();
  const m = S.msgs.concat(FAM.local).find(x => String(x.id) === el.dataset.id); if (!m) return;
  const r = el.getBoundingClientRect();
